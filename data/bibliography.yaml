    verified_via: "Crossref API record for 10.1080/00401706.1970.10488634 — title, both authors, Technometrics vol 12 issue 1, pages 55-67, 1970"
    contribution: >-
      Introduced the L2 penalty for linear regression, showing that adding a
      small ridge to the diagonal of X^T X yields a biased estimator with lower
      total mean squared error than ordinary least squares when the design
      matrix is ill-conditioned.
    why_it_mattered: >-
      It made the case that unbiasedness is not the right objective — a
      deliberately biased estimator can be uniformly better — which is the
      conceptual root of every regularisation method that followed, including
      weight decay in neural networks.
    what_changed_after: >-
      Penalised estimation became standard practice rather than a curiosity, and
      the bias-variance trade-off became something a practitioner tunes rather
