      a cost the neural language models of the day could not match.
    why_it_mattered: >
      It made dense word representations cheap enough to be infrastructure
      rather than research, and it introduced the analogy evaluation that
      shaped how the field talked about embeddings for years.
    what_changed_after: >
      Pretrained word vectors became a standard input layer for every NLP
