    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2501.19393 - title, ten authors, January 2025; abstract confirms the s1K dataset of 1,000 questions paired with reasoning traces, budget forcing by either terminating the thinking process or lengthening it by appending 'Wait', and a Qwen2.5-32B model exceeding o1-preview on competition maths by up to 27%."
    contribution: >
      A thousand examples and a decoding trick - force the model to keep thinking
      by appending "Wait", or stop it - reproduced much of the test-time scaling
      behaviour.
    why_it_mattered: >
      Reframes reasoning length as something you CONTROL at inference rather than
      something the model decides, and shows how little data is needed to install
