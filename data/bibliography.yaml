    why_it_mattered: >
      It is the index in essentially every vector database shipped since 2019.
      No competitor has displaced it for in-memory search at moderate scale.
    what_changed_after: >
      Vector search became an infrastructure category rather than a research
      topic, and its parameters (M, efConstruction, efSearch) became things
      application engineers tune.
    descendants: ["FAISS HNSW", "hnswlib", "pgvector", "every vector database"]

  jegou2011pq:
    title: "Product Quantization for Nearest Neighbor Search"
    authors: ["Herve Jegou", "Matthijs Douze", "Cordelia Schmid"]
    year: 2011
    venue: "IEEE TPAMI 33(1):117-128"
    url: "https://dl.acm.org/doi/10.1109/TPAMI.2010.57"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "ACM DL and PubMed records for DOI 10.1109/TPAMI.2010.57 — TPAMI volume 33, issue 1, pages 117-128, 2011, three authors confirmed."
    contribution: >
      Split a vector into subvectors, quantize each with its own small codebook,
      and represent the whole vector by the tuple of centroid ids — making the
      effective codebook size the product of the parts.
    why_it_mattered: >
      It is the compression scheme that makes billion-scale vector search fit in
      memory, and the asymmetric distance computation it introduced is why the
      compression costs less accuracy than it should.
    what_changed_after: >
      Every large-scale ANN system uses PQ or a descendant; the residual
      compression in ColBERTv2 and the quantization in ScaNN are both variants.
    descendants: ["OPQ", "IVFPQ", "ScaNN", "ColBERTv2 residual compression"]

