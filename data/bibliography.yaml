      A systematic empirical comparison of methods for detecting dataset shift
      without labels: dimensionality reduction followed by two-sample testing,
      compared against univariate tests with multiple-testing correction and
      against classifier-based two-sample tests.
    why_it_mattered: >-
      It addresses the regime production systems are actually in — labels
      delayed or absent — which the supervised drift literature does not. Its
      finding that a reduction plus a two-sample test is a strong general
      approach, and that per-feature tests with correction are a surprisingly
      strong baseline, is directly usable.
    descendants: ["alibi-detect and comparable drift libraries",
                  "the input-monitoring layer of production ML platforms"]

  rosenblatt1958:
    title: "The perceptron: A probabilistic model for information storage and organization in the brain"
    authors: ["Frank Rosenblatt"]
    year: 1958
    venue: "Psychological Review 65(6), 386-408"
    doi: "10.1037/h0042519"
    url: "https://doi.org/10.1037/h0042519"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1037/h0042519 — title, author, Psychological Review volume 65, pages 386-408, 1958"
    contribution: >-
      A learning rule for a linear threshold unit, with a convergence guarantee
      when the data is linearly separable — the first algorithm that adjusted
      its own parameters from examples rather than being programmed.
    why_it_mattered: >-
      It established the central premise of the field: that a machine can learn
      a decision rule from labelled examples by iteratively correcting its own
      errors. Every parameter update in this book is a descendant.
    what_changed_after: >-
      Enormous early enthusiasm, followed by a collapse when the linear
      hypothesis space was shown to exclude XOR. The lesson that survived is
      that a learning rule and a hypothesis space are separate choices.
    descendants: ["multi-layer perceptrons", "the entire connectionist tradition"]

  cybenko1989:
    title: "Approximation by superpositions of a sigmoidal function"
    authors: ["George Cybenko"]
    year: 1989
    venue: "Mathematics of Control, Signals, and Systems 2, 303-314"
    doi: "10.1007/BF02551274"
    url: "https://doi.org/10.1007/BF02551274"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1007/BF02551274 — title, author, MCSS volume 2, pages 303-314, 1989"
    contribution: >-
      Proved that finite sums of a sigmoidal function of affine maps are dense
      in the continuous functions on a compact set: a single hidden layer of
      sufficient width can approximate any continuous function arbitrarily
      well.
    why_it_mattered: >-
      It answered the representational question left open after Minsky and
      Papert — the hypothesis space of a network with one hidden layer is not
      merely larger than a perceptron's, it is universal.
    what_changed_after: >-
      Attention shifted from what networks CAN represent to what they can be
      trained to find and how efficiently, since the theorem bounds neither the
      width required nor the optimisation difficulty.
    descendants: ["depth-separation results", "expressivity theory"]

  rumelhart1986:
    title: "Learning representations by back-propagating errors"
    authors: ["David E. Rumelhart", "Geoffrey E. Hinton", "Ronald J. Williams"]
    year: 1986
    venue: "Nature 323, 533-536"
    doi: "10.1038/323533a0"
    url: "https://doi.org/10.1038/323533a0"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1038/323533a0 — title, three authors, Nature volume 323, pages 533-536, October 1986"
    contribution: >-
      Popularised the application of reverse-mode differentiation to
      multi-layer networks, making it practical to train hidden layers by
      propagating error derivatives backwards through the architecture.
    why_it_mattered: >-
      It supplied the missing training algorithm for the multi-layer networks
      that Minsky and Papert's critique had implied were necessary, and turned
      the universal-approximation result from an existence statement into an
      engineering method.
    what_changed_after: >-
      Multi-layer networks became trainable in practice, which is the
      precondition for everything in Parts VI onward. The algorithm is
      unchanged today; only its scale and its numerics have moved.
    descendants: ["automatic differentiation frameworks", "every deep network trained since"]

  bengio1994:
    title: "Learning long-term dependencies with gradient descent is difficult"
    authors: ["Yoshua Bengio", "Patrice Simard", "Paolo Frasconi"]
    year: 1994
    venue: "IEEE Transactions on Neural Networks 5(2), 157-166"
    doi: "10.1109/72.279181"
    url: "https://doi.org/10.1109/72.279181"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1109/72.279181 — title, three authors, IEEE TNN volume 5, pages 157-166, March 1994"
    contribution: >-
      Showed that the difficulty of learning long-range dependencies in
      recurrent networks is not an implementation problem but a structural one:
      gradients through a long product of Jacobians either vanish or explode,
      and the condition for stable storage of information is close to the
      condition that makes gradients vanish.
    why_it_mattered: >-
      It converted a practical frustration into a theorem, and located the
      problem in the repeated multiplication rather than in the optimiser. That
      diagnosis is what gated architectures were designed against.
    descendants: ["LSTM (hochreiter1997)", "gradient clipping", "residual connections",
                  "state space models"]

  hochreiter1997:
    title: "Long Short-Term Memory"
    authors: ["Sepp Hochreiter", "Jürgen Schmidhuber"]
    year: 1997
    venue: "Neural Computation 9(8), 1735-1780"
    doi: "10.1162/neco.1997.9.8.1735"
    url: "https://doi.org/10.1162/neco.1997.9.8.1735"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1162/neco.1997.9.8.1735 — title, both authors, Neural Computation volume 9, pages 1735-1780, 1997"
    contribution: >-
      An architecture with a linear self-connected memory cell and multiplicative
      gates, so that gradient can flow across many steps without being repeatedly
      multiplied by a weight matrix.
    why_it_mattered: >-
      It made long-range sequence learning work in practice for the first time,
      and the mechanism — an additive path that the gradient can travel along
      unattenuated — is the same idea that residual connections later brought to
      depth rather than time.
    what_changed_after: >-
      Two decades of sequence modelling, until attention removed the need for a
      sequential bottleneck. The additive-path idea outlived the architecture.
    descendants: ["GRU", "residual connections (he2016resnet)", "state space models"]

  lecun1998:
    title: "Gradient-based learning applied to document recognition"
    authors: ["Yann LeCun", "Léon Bottou", "Yoshua Bengio", "Patrick Haffner"]
    year: 1998
    venue: "Proceedings of the IEEE 86(11), 2278-2324"
    doi: "10.1109/5.726791"
    url: "https://doi.org/10.1109/5.726791"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1109/5.726791 — title, four authors, Proceedings of the IEEE volume 86, pages 2278-2324, 1998"
    contribution: >-
      Established the convolutional architecture — local receptive fields,
      shared weights and spatial subsampling — as a way of building translation
      equivariance into the hypothesis space rather than learning it from data.
    why_it_mattered: >-
      It is the clearest demonstration in the field that an architecture is an
      assumption: the convolution encodes what is known about images, and that
      prior is worth orders of magnitude of data.
    descendants: ["AlexNet (krizhevsky2012)", "ResNet (he2016resnet)",
                  "every convolutional vision model"]

  hinton2006:
    title: "A Fast Learning Algorithm for Deep Belief Nets"
    authors: ["Geoffrey E. Hinton", "Simon Osindero", "Yee-Whye Teh"]
    year: 2006
    venue: "Neural Computation 18(7), 1527-1554"
    doi: "10.1162/neco.2006.18.7.1527"
    url: "https://doi.org/10.1162/neco.2006.18.7.1527"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1162/neco.2006.18.7.1527 — title, three authors, Neural Computation volume 18, pages 1527-1554, July 2006"
    contribution: >-
      A layer-wise unsupervised pre-training scheme that made deep networks
      trainable at a time when training them end to end from random
      initialisation reliably failed.
    why_it_mattered: >-
      It restarted the field. The specific method was superseded within a few
      years by better initialisation, better activations and more data, but it
      established that depth was achievable and worth pursuing.
    what_changed_after: >-
      Unsupervised pre-training was abandoned for supervised vision tasks and
      then returned, transformed, as the pre-training paradigm of Part IX.
    descendants: ["denoising autoencoders", "modern self-supervised pre-training"]

  glorot2010:
    title: "Understanding the difficulty of training deep feedforward neural networks"
    authors: ["Xavier Glorot", "Yoshua Bengio"]
    year: 2010
    venue: "Proceedings of the Thirteenth International Conference on Artificial Intelligence and Statistics, PMLR 9, 249-256"
    url: "https://proceedings.mlr.press/v9/glorot10a.html"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Official PMLR page proceedings.mlr.press/v9/glorot10a.html — title, both authors, AISTATS volume 9, pages 249-256, 2010"
    contribution: >-
      Diagnosed why deep networks failed to train by measuring activation and
      gradient variance layer by layer, and derived an initialisation scale
      that keeps both approximately constant with depth.
    why_it_mattered: >-
      It replaced initialisation folklore with a variance calculation, and in
      doing so reframed trainability as a signal-propagation problem — the
      frame that normalisation and residual connections were later designed
      within.
    descendants: ["He initialisation (he2015init)", "normalization layers",
                  "signal-propagation analyses of deep networks"]

  krizhevsky2012:
    title: "ImageNet classification with deep convolutional neural networks"
    authors: ["Alex Krizhevsky", "Ilya Sutskever", "Geoffrey E. Hinton"]
    year: 2017
    venue: "Communications of the ACM 60(6), 84-90 (originally NIPS 2012)"
    doi: "10.1145/3065386"
    url: "https://doi.org/10.1145/3065386"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1145/3065386 — title, three authors, Communications of the ACM volume 60, pages 84-90. This is the 2017 CACM reprint, which is the version carrying a DOI; the original appeared at NIPS 2012."
    contribution: >-
      Won ImageNet 2012 by a large margin with a deep convolutional network
      trained on GPUs, using ReLU activations, dropout and heavy data
      augmentation.
    why_it_mattered: >-
      It was the empirical demonstration that ended the argument. The
      components were mostly known; what was new was the combination of scale,
      hardware and a dataset large enough for the capacity to pay.
    what_changed_after: >-
      Deep learning became the default approach to perception within about two
      years, and GPU training became a precondition for competitive work.
    descendants: ["VGG", "ResNet (he2016resnet)", "the modern vision stack"]

  srivastava2014:
    title: "Dropout: A Simple Way to Prevent Neural Networks from Overfitting"
    authors: ["Nitish Srivastava", "Geoffrey Hinton", "Alex Krizhevsky",
              "Ilya Sutskever", "Ruslan Salakhutdinov"]
    year: 2014
    venue: "Journal of Machine Learning Research 15, 1929-1958"
    url: "https://www.jmlr.org/papers/v15/srivastava14a.html"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Official JMLR page jmlr.org/papers/v15/srivastava14a.html — title, five authors, volume 15, pages 1929-1958, 2014"
    contribution: >-
      Randomly zeroing units during training, which prevents co-adaptation
      between them and is interpretable as training an exponentially large
      ensemble of subnetworks that share weights.
    why_it_mattered: >-
      It was the dominant regulariser of the era and gave the field an
      ensemble-flavoured account of why a stochastic training perturbation
      improves generalisation.
    what_changed_after: >-
      Largely displaced in convolutional networks by batch normalisation and
      heavy augmentation, and retained in transformers at low rates. The
      ensemble framing persists.
    descendants: ["DropConnect", "stochastic depth", "Monte Carlo dropout for uncertainty"]

  he2015init:
    title: "Delving Deep into Rectifiers: Surpassing Human-Level Performance on ImageNet Classification"
    authors: ["Kaiming He", "Xiangyu Zhang", "Shaoqing Ren", "Jian Sun"]
    year: 2015
    venue: "2015 IEEE International Conference on Computer Vision (ICCV), 1026-1034"
    doi: "10.1109/ICCV.2015.123"
    url: "https://doi.org/10.1109/ICCV.2015.123"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1109/ICCV.2015.123 — title, four authors, ICCV 2015, pages 1026-1034"
    contribution: >-
      Redid Glorot's variance calculation for rectified units, which zero half
      the activations and therefore halve the variance, giving the factor of
      two that makes very deep rectified networks trainable; and introduced
      PReLU.
    why_it_mattered: >-
      It is the clearest case in the field of a one-line change with a
      three-line derivation unlocking a large practical gain, and it made
      thirty-layer rectified networks trainable from scratch.
    descendants: ["ResNet (he2016resnet)", "the default initialisation in every framework"]

  he2016resnet:
    title: "Deep Residual Learning for Image Recognition"
    authors: ["Kaiming He", "Xiangyu Zhang", "Shaoqing Ren", "Jian Sun"]
    year: 2016
    venue: "2016 IEEE Conference on Computer Vision and Pattern Recognition (CVPR), 770-778"
    doi: "10.1109/CVPR.2016.90"
    url: "https://doi.org/10.1109/CVPR.2016.90"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "Crossref API record for 10.1109/CVPR.2016.90 — title, four authors, CVPR 2016, pages 770-778"
    contribution: >-
      Reformulated layers to learn a residual relative to their input, so that
      the identity is the default behaviour and the gradient has an
      unattenuated additive path to every layer.
    why_it_mattered: >-
      It removed depth as a barrier. The observation that motivated it — deeper
      plain networks were WORSE on training error, not merely on test error —
      showed the problem was optimisation rather than capacity, and the fix
      generalised far beyond vision.
    what_changed_after: >-
      Residual connections became universal, including in every transformer.
      The additive-path idea unifies this with LSTM's memory cell.
    descendants: ["every transformer block", "DenseNet", "stochastic depth"]

  kingma2015adam:
    title: "Adam: A Method for Stochastic Optimization"
    authors: ["Diederik P. Kingma", "Jimmy Ba"]
    year: 2014
    venue: "arXiv 1412.6980 (presented at ICLR 2015)"
    arxiv: "1412.6980"
    url: "https://arxiv.org/abs/1412.6980"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1412.6980 — title, both authors, v1 submitted 2014-12-22. The arXiv record carries no journal reference; the ICLR 2015 venue is widely reported and is stated here as context rather than as verified metadata."
    contribution: >-
      Combined momentum with a per-parameter adaptive step size from a running
      second-moment estimate, plus bias correction for the initialisation of
      both moment accumulators.
    why_it_mattered: >-
      It made training work acceptably across a wide range of architectures
      without per-problem learning-rate tuning, which mattered enormously when
      architectures were changing every few months.
    descendants: ["AdamW (loshchilov2019adamw)", "Adafactor", "LAMB", "Lion"]

  ioffe2015:
    title: "Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift"
    authors: ["Sergey Ioffe", "Christian Szegedy"]
    year: 2015
    venue: "arXiv 1502.03167 (presented at ICML 2015)"
    arxiv: "1502.03167"
    url: "https://arxiv.org/abs/1502.03167"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1502.03167 — title, both authors, v1 submitted 2015-02-11. No journal reference on the arXiv record; ICML 2015 stated as context."
    contribution: >-
      Normalising each layer's pre-activations across the batch, with learnable
      scale and shift, which permits much larger learning rates and reduces
      sensitivity to initialisation.
    why_it_mattered: >-
      It made deep networks dramatically easier to train, and it is also a
      cautionary tale: the mechanism named in its title was later shown not to
      be the operative one (santurkar2018), while the technique itself works.
    what_changed_after: >-
      Normalisation became a standard component. The batch dependence it
      introduced later motivated LayerNorm and RMSNorm for sequence models.
    descendants: ["LayerNorm (ba2016layernorm)", "RMSNorm (zhang2019rmsnorm)",
                  "GroupNorm"]

  ba2016layernorm:
    title: "Layer Normalization"
    authors: ["Jimmy Lei Ba", "Jamie Ryan Kiros", "Geoffrey E. Hinton"]
    year: 2016
    venue: "arXiv 1607.06450"
    arxiv: "1607.06450"
    url: "https://arxiv.org/abs/1607.06450"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1607.06450 — title, three authors, v1 submitted 2016-07-21"
    contribution: >-
      Normalising across the features of a single example rather than across
      the batch, which removes the dependence on batch size and makes the
      operation identical at training and inference time.
    why_it_mattered: >-
      Batch statistics are awkward for variable-length sequences and unusable
      at batch size one. LayerNorm made normalisation available to recurrent
      and, later, transformer architectures.
    descendants: ["RMSNorm (zhang2019rmsnorm)", "the normalisation in every transformer"]

  zhang2017rethinking:
    title: "Understanding deep learning requires rethinking generalization"
    authors: ["Chiyuan Zhang", "Samy Bengio", "Moritz Hardt", "Benjamin Recht",
              "Oriol Vinyals"]
    year: 2016
    venue: "arXiv 1611.03530 (presented at ICLR 2017)"
    arxiv: "1611.03530"
    url: "https://arxiv.org/abs/1611.03530"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1611.03530 — title, five authors, v1 submitted 2016-11-10. No journal reference on the arXiv record; ICLR 2017 stated as context."
    contribution: >-
      Showed that standard architectures trained with standard methods can fit
      randomly labelled data perfectly, so their effective capacity is
      sufficient to memorise the training set outright.
    why_it_mattered: >-
      It demonstrated that classical uniform-convergence bounds cannot explain
      why these models generalise, since the same model that generalises on
      real labels also memorises random ones. Explicit regularisation improves
      generalisation but is not what makes it possible.
    what_changed_after: >-
      A large literature on implicit regularisation, double descent and
      benign overfitting; the question remains open.
    descendants: ["double-descent studies", "implicit-bias analyses of SGD"]

  santurkar2018:
    title: "How Does Batch Normalization Help Optimization?"
    authors: ["Shibani Santurkar", "Dimitris Tsipras", "Andrew Ilyas",
              "Aleksander Madry"]
    year: 2018
    venue: "arXiv 1805.11604 (presented at NeurIPS 2018)"
    arxiv: "1805.11604"
    url: "https://arxiv.org/abs/1805.11604"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1805.11604 — title, four authors, v1 submitted 2018-05-29. No journal reference on the arXiv record; NeurIPS 2018 stated as context."
    contribution: >-
      Tested the internal-covariate-shift explanation directly by injecting
      distributional noise after the normalisation layer, and found the
      training benefit survived. Proposed instead that batch normalisation
      smooths the loss landscape, improving the Lipschitz constants of the loss
      and its gradients.
    why_it_mattered: >-
      A widely repeated mechanistic explanation was shown to be wrong while the
      technique it explained remained correct — a useful and uncomfortable
      demonstration that a method working is not evidence that the stated
      reason is right.
    descendants: ["loss-landscape analyses", "normalisation-free architectures"]

  loshchilov2019adamw:
    title: "Decoupled Weight Decay Regularization"
    authors: ["Ilya Loshchilov", "Frank Hutter"]
    year: 2017
    venue: "arXiv 1711.05101 (presented at ICLR 2019)"
    arxiv: "1711.05101"
    url: "https://arxiv.org/abs/1711.05101"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1711.05101 — title, both authors, v1 submitted 2017-11-14. No journal reference on the arXiv record; ICLR 2019 stated as context."
    contribution: >-
      Showed that adding an L2 penalty to the loss is not equivalent to weight
      decay under an adaptive optimiser, because the adaptive denominator
      rescales the penalty per parameter, and decoupled the decay from the
      gradient update.
    why_it_mattered: >-
      It corrected a subtle and universal bug: everyone believed they were
      applying weight decay and were applying something else. AdamW became the
      default optimiser for transformer training.
    descendants: ["the default optimiser configuration of essentially every LLM"]

  zhang2019rmsnorm:
    title: "Root Mean Square Layer Normalization"
    authors: ["Biao Zhang", "Rico Sennrich"]
    year: 2019
    venue: "arXiv 1910.07467 (presented at NeurIPS 2019)"
    arxiv: "1910.07467"
    url: "https://arxiv.org/abs/1910.07467"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1910.07467 — title, both authors, v1 submitted 2019-10-16. No journal reference on the arXiv record; NeurIPS 2019 stated as context."
    contribution: >-
      Removed the mean-centring step from LayerNorm, rescaling only by the root
      mean square, and showed comparable quality at meaningfully lower cost.
    why_it_mattered: >-
      It identified that the re-centring half of LayerNorm was doing little
      work, and the resulting simplification is now the standard normalisation
      in essentially every large open-weight language model.
    descendants: ["the normalisation layer of LLaMA, Mistral, Gemma, Qwen and successors"]

  kingma2014vae:
    title: "Auto-Encoding Variational Bayes"
    authors: ["Diederik P. Kingma", "Max Welling"]
    year: 2013
    venue: "arXiv 1312.6114 (presented at ICLR 2014)"
    arxiv: "1312.6114"
    url: "https://arxiv.org/abs/1312.6114"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv API record for 1312.6114 — title, both authors, v1 submitted 2013-12-20. No journal reference on the arXiv record; ICLR 2014 stated as context."
    contribution: >-
      Made variational inference trainable by gradient descent through the
      reparameterisation trick, turning an autoencoder into a generative model
      with a probabilistic latent space.
    why_it_mattered: >-
      It gave deep learning a principled generative latent-variable model and
      introduced the reparameterisation trick, which is now standard wherever a
      gradient must pass through a sampling step.
    descendants: ["VQ-VAE", "the latent space of latent diffusion models",
                  "reparameterisation in stochastic computation graphs"]

  szegedy2016:
    title: "Rethinking the Inception Architecture for Computer Vision"
    authors: ["Christian Szegedy", "Vincent Vanhoucke", "Sergey Ioffe",
              "Jonathon Shlens", "Zbigniew Wojna"]
    year: 2016
    venue: "CVPR 2016 (arXiv preprint December 2015)"
    arxiv: "1512.00567"
    url: "https://arxiv.org/abs/1512.00567"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv abstract page arxiv.org/abs/1512.00567 — title, five authors and 2015 submission confirmed; abstract confirms the paper's subject is efficient scaling via factorized convolutions and aggressive regularization."
    contribution: >
      Introduced Inception-v2/v3 and, as one of its regularization components,
      label smoothing: replacing the one-hot target with a mixture of the
      one-hot vector and the uniform distribution.
    why_it_mattered: >
      Label smoothing became a near-universal default in classification and
      later in sequence models, on the strength of a short subsection of a
      paper primarily about convolutional architecture.
    what_changed_after: >
      Adopted throughout image classification and machine translation; later
      analysed as improving calibration and as a form of distillation from a
      uniform teacher.
    descendants: ["Transformer training recipes", "calibration literature",
                  "knowledge distillation"]

  lin2017focal:
    title: "Focal Loss for Dense Object Detection"
    authors: ["Tsung-Yi Lin", "Priya Goyal", "Ross Girshick", "Kaiming He",
              "Piotr Dollár"]
    year: 2017
    venue: "ICCV 2017 (arXiv preprint August 2017)"
    arxiv: "1708.02002"
    url: "https://arxiv.org/abs/1708.02002"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv abstract page arxiv.org/abs/1708.02002 — title, five authors and 2017 submission confirmed; abstract confirms the extreme foreground-background imbalance motivation and the down-weighting of well-classified examples."
    contribution: >
      Identified extreme foreground/background class imbalance as the reason
      one-stage detectors trailed two-stage ones, and proposed a loss that
      down-weights well-classified examples by a factor (1-p)^gamma.
    why_it_mattered: >
      Made one-stage detection competitive with two-stage detection, and gave
      the field a widely reused tool for imbalanced classification.
    what_changed_after: >
      RetinaNet became a standard detection baseline; focal loss was adopted
      well outside detection, often at imbalance ratios far milder than the
      thousands-to-one regime it was validated in.
    descendants: ["RetinaNet", "one-stage detectors", "imbalanced-classification practice"]

  baydin2018:
    title: "Automatic Differentiation in Machine Learning: a Survey"
    authors: ["Atilim Gunes Baydin", "Barak A. Pearlmutter",
              "Alexey Andreyevich Radul", "Jeffrey Mark Siskind"]
    year: 2018
    venue: "Journal of Machine Learning Research 18(153):1-43 (arXiv preprint 2015)"
    arxiv: "1502.05767"
    url: "https://arxiv.org/abs/1502.05767"
    verified: true
    verified_on: "2026-08-14"
    verified_via: "arXiv abstract page arxiv.org/abs/1502.05767 — title, four authors, 2015 submission and the JMLR 18(153):1-43, 2018 journal reference all confirmed on the listing."
    contribution: >
      Surveys automatic differentiation for a machine learning audience, and
