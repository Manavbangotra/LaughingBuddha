    arxiv: "1804.10959"
    url: "https://arxiv.org/abs/1804.10959"
    verified: true
    verified_on: "2026-08-20"
    verified_via: "arXiv abstract page arxiv.org/abs/1804.10959 — single author, v1 dated 29 April 2018, page states acceptance at ACL2018 as a long paper."
    contribution: >
      Introduced the unigram language model tokenizer, which starts from a
      large candidate vocabulary and prunes it by likelihood rather than
      growing it by merges, and which yields a distribution over segmentations
      rather than one segmentation.
    why_it_mattered: >
      It is the only mainstream tokenizer with a probabilistic objective, and
      the sampling it enables is a genuine data augmentation for translation.
      It also makes explicit that BPE's segmentation is arbitrary — one of many
      valid ones, chosen by a greedy rule with no model behind it.
    what_changed_after: >
      Unigram became SentencePiece's other mode and the default for several
      multilingual models; BPE-dropout followed the same idea for BPE.
    descendants: ["SentencePiece unigram mode", "BPE-dropout", "T5 tokenizer"]

  mikolov2013efficient:
    title: "Efficient Estimation of Word Representations in Vector Space"
