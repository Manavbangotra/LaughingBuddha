    authors: ["Charlie Snell", "Jaehoon Lee", "Kelvin Xu", "Aviral Kumar"]
    year: 2024
    venue: "ICLR 2025 (arXiv preprint August 2024)"
    arxiv: "2408.03314"
    url: "https://arxiv.org/abs/2408.03314"
    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2408.03314 - title, four authors, August 2024; abstract confirms two mechanisms for scaling test-time compute (search against process-based verifier reward models, and adaptively updating the response distribution given the prompt), a compute-optimal allocation that adapts per prompt improving efficiency by more than 4x over best-of-N, and FLOPs-matched comparisons where test-time compute can outperform a 14x larger model on problems where the smaller model already partly succeeds."
    contribution: >
      Made test-time compute a budget to be ALLOCATED rather than a switch to be
      turned on: how much to spend depends on the prompt's difficulty, and
      allocating adaptively is worth more than 4x against uniform best-of-N.
    why_it_mattered: >
      Turned "think longer" into an economics question with a computable answer,
      and established the FLOPs-matched comparison against pretraining that makes
      the trade legible.
    what_changed_after: >
      Inference-compute budgets became a first-class deployment parameter, and
      the difficulty-estimation step became a component people build rather than
      assume.
    descendants: ["adaptive inference budgets", "difficulty-aware routing"]

  brown2024monkeys:
    title: "Large Language Monkeys: Scaling Inference Compute with Repeated Sampling"
    authors: ["Bradley Brown", "Jordan Juravsky", "Ryan Ehrlich",
              "Ronald Clark", "Quoc V. Le", "Christopher Ré",
              "Azalia Mirhoseini"]
    year: 2024
    venue: "arXiv preprint (July 2024)"
    arxiv: "2407.21787"
    url: "https://arxiv.org/abs/2407.21787"
    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2407.21787 - title, seven authors, July 2024; abstract confirms that coverage against number of samples is often log-linear and fits an exponentiated power law, that SWE-bench Lite goes from 15.9% with one sample to 56% with 250 samples using DeepSeek-Coder-V2-Instruct, and that in domains without automatic verification majority voting and reward models plateau beyond several hundred samples."
    contribution: >
      Separated COVERAGE - does any sample solve it - from SELECTION - can you
      tell which one did. Coverage scales log-linearly and impressively;
      selection is where the wall is.
    why_it_mattered: >
      The clearest statement of why test-time compute works spectacularly in
      verifiable domains and modestly elsewhere. It is a verification problem,
      not a generation problem, and the paper measures exactly that gap.
    what_changed_after: >
      Verifier quality became the reported bottleneck for repeated sampling, and
      "coverage at k" entered the standard vocabulary alongside pass@1.
    descendants: ["coverage-versus-selection analysis", "verifier scaling studies"]

