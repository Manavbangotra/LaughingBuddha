    authors: ["Martin Aumuller", "Erik Bernhardsson", "Alexander Faithfull"]
    year: 2020
    venue: "Information Systems 87 (arXiv preprint July 2018; full version of the SISAP 2017 paper)"
    arxiv: "1807.05614"
    url: "https://arxiv.org/abs/1807.05614"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/1807.05614 — title, three authors, v1 dated 15 July 2018, described on the page as the full version of the SISAP 2017 conference paper."
    contribution: >
      A standard harness and set of datasets for ANN evaluation, reporting the
