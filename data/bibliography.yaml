    verified_via: "ScienceDirect listing and Semantic Scholar record — Information Systems volume 45, pages 61-68, 2014, four authors confirmed."
    contribution: >
      Proximity graph search over a navigable small-world graph: long-range
      links created early in insertion give logarithmic hops, short-range links
      give accuracy.
    why_it_mattered: >
      It is the direct ancestor of HNSW and the origin of the insight that
      insertion order alone can produce the long links a small-world graph needs.
    what_changed_after: >
      Graph-based ANN displaced tree- and hash-based methods for in-memory
      vector search.
    descendants: ["HNSW", "NGT", "Vamana/DiskANN"]

  malkov2020hnsw:
    title: "Efficient and Robust Approximate Nearest Neighbor Search Using Hierarchical Navigable Small World Graphs"
    authors: ["Yury A. Malkov", "Dmitry A. Yashunin"]
    year: 2020
    venue: "IEEE TPAMI 42(4):824-836 (arXiv preprint March 2016)"
    arxiv: "1603.09320"
    url: "https://arxiv.org/abs/1603.09320"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/1603.09320 — title, two authors, v1 dated 30 March 2016, v4 August 2018; TPAMI 42(4):824-836 with DOI 10.1109/TPAMI.2018.2889473 confirmed via the journal record."
    contribution: >
      HNSW: a hierarchy of proximity graphs with exponentially decaying
