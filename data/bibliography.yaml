  sprague2024tocot:
    title: "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning"
    authors: ["Zayne Sprague", "Fangcong Yin", "Juan Diego Rodriguez",
              "Dongwei Jiang", "Manya Wadhwa", "Prasann Singhal", "Xinyu Zhao",
              "Xi Ye", "Kyle Mahowald", "Greg Durrett"]
    year: 2024
    venue: "ICLR 2025 (arXiv preprint September 2024)"
    arxiv: "2409.12183"
    url: "https://arxiv.org/abs/2409.12183"
    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2409.12183 - title, ten authors, September 2024; abstract confirms a meta-analysis over 100 papers plus the authors' own evaluations on 20 datasets and 14 models, that gains are concentrated in maths and logic with much smaller gains elsewhere and almost none on MMLU without symbolic operations, and that much of the gain comes from improved symbolic execution while underperforming an actual symbolic solver."
    contribution: >
      The meta-analysis that bounded chain-of-thought's scope: it helps on maths
      and symbolic tasks and barely anywhere else, and where it helps it is doing
      execution that a real solver does better.
    why_it_mattered: >
      Corrects a widespread overgeneralisation. Chain-of-thought is deployed by
      default across every task type, and this says most of those deployments are
      paying tokens for nothing.
    what_changed_after: >
      Selective reasoning - deciding per prompt whether to think - became a real
      technique rather than an optimisation, and tool use became the recommended
      answer where CoT was doing arithmetic.
    descendants: ["selective/adaptive reasoning", "tool-augmented reasoning"]

  mirzadeh2024gsmsymbolic:
