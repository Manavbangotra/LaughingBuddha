  radovanovic2010hubs:
    title: "Hubs in Space: Popular Nearest Neighbors in High-Dimensional Data"
    authors: ["Milos Radovanovic", "Alexandros Nanopoulos", "Mirjana Ivanovic"]
    year: 2010
    venue: "Journal of Machine Learning Research 11:2487-2531"
    url: "https://jmlr.org/papers/v11/radovanovic10a.html"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "JMLR volume 11 listing at jmlr.org/papers/v11/radovanovic10a.html — title, three authors, pages 2487-2531, 2010 confirmed."
    contribution: >
      Identified hubness: in high dimension the distribution of k-occurrence —
      how often a point appears in others' nearest-neighbour lists — becomes
      severely skewed, so a few "hub" points are returned for almost every query
      and many points are returned for none.
    why_it_mattered: >
      It is a distinct high-dimensional pathology from distance concentration,
      it is the mechanism behind the "same document keeps coming back" complaint
      in vector search, and it is measurable on any index for free.
    what_changed_after: >
      Hubness-aware similarity corrections and score normalisations entered the
      retrieval and recommendation literature.
    descendants: ["hubness reduction", "mutual proximity", "score normalisation in retrieval"]

  # ── Part XII: Retrieval-Augmented Generation ───────────────────────────────

  lewis2020rag:
    title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
    authors: ["Patrick Lewis", "Ethan Perez", "Aleksandra Piktus",
              "Fabio Petroni", "Vladimir Karpukhin", "Naman Goyal",
              "Heinrich Kuttler", "Mike Lewis", "Wen-tau Yih",
              "Tim Rocktaschel", "Sebastian Riedel", "Douwe Kiela"]
    year: 2020
    venue: "NeurIPS 2020"
    arxiv: "2005.11401"
    url: "https://arxiv.org/abs/2005.11401"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/2005.11401 — title, twelve authors, v1 dated 22 May 2020, NeurIPS 2020 acceptance stated on the page."
    contribution: >
      Named and formalised retrieval-augmented generation: a parametric
      seq2seq model conditioned on documents retrieved by a dense retriever,
      trained end to end with the retriever's output marginalised over.
    why_it_mattered: >
      It established that knowledge could live outside the weights and be
      swapped without retraining — the single architectural idea that most
      production LLM systems are built on.
    what_changed_after: >
      RAG became the default architecture for grounding an LLM in private or
      current data, and the term detached from this paper's specific
      end-to-end-trained method to mean the general pattern.
    descendants: ["every production RAG system", "Self-RAG", "CRAG", "GraphRAG"]

  guu2020realm:
    title: "REALM: Retrieval-Augmented Language Model Pre-Training"
    authors: ["Kelvin Guu", "Kenton Lee", "Zora Tung", "Panupong Pasupat",
