    verified_via: "Crossref API record for DOI 10.1007/BF00994018 — title, two authors, Machine Learning volume 20 issue 3, pages 273-297, year"
    contribution: >-
      Introduced the soft-margin support vector machine: maximise the margin
      between classes while permitting bounded violations, with the solution
      depending only on the support vectors and expressible through inner
      products alone.
    why_it_mattered: >-
      The inner-product formulation is what permits the kernel trick — implicit
      computation in a high-dimensional feature space without ever forming the
      coordinates — and margin maximisation gave a principled account of
      generalisation that predated the empirical era.
    what_changed_after: >-
      SVMs were the strongest general-purpose classifier for roughly a decade,
      until ensembles overtook them on tabular data and deep networks on
      unstructured data.
    descendants: ["kernel methods generally", "support vector regression",
