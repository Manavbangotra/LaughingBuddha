  # ── Part XI: Embeddings and Vector Search ──────────────────────────────────

  oord2018cpc:
    title: "Representation Learning with Contrastive Predictive Coding"
    authors: ["Aaron van den Oord", "Yazhe Li", "Oriol Vinyals"]
    year: 2018
    venue: "arXiv preprint (never formally published)"
    arxiv: "1807.03748"
    url: "https://arxiv.org/abs/1807.03748"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/1807.03748 — title, three authors, v1 dated 10 July 2018 confirmed; the page lists no venue."
    contribution: >
      Introduced InfoNCE, the contrastive loss that scores one positive against
      a batch of negatives and is a lower bound on mutual information between
      the paired views.
    why_it_mattered: >
      Nearly every modern embedding model is trained with InfoNCE or a close
      variant. The loss is what makes "similar things should be near each other"
      into something differentiable, and its in-batch negative construction is
      why embedding training is dominated by batch size rather than data volume.
    what_changed_after: >
      Contrastive learning became the default objective for representation
      learning across text, vision, and audio, displacing reconstruction-based
      autoencoding for retrieval purposes.
    descendants: ["SimCLR", "SimCSE", "CLIP", "E5", "every dual-encoder retriever"]

