    contribution: >
      Showed that depth is the variable that matters, by stacking many 3x3
      convolutions instead of few large ones - two stacked 3x3 filters see what
      one 5x5 sees, with fewer parameters and an extra nonlinearity.
    why_it_mattered: >
      It replaced architecture folklore with a controlled depth sweep, and the
