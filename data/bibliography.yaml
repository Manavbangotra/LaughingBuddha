              "Maarten Bosma", "Denny Zhou", "Donald Metzler", "Ed H. Chi",
              "Tatsunori Hashimoto", "Oriol Vinyals", "Percy Liang",
              "Jeff Dean", "William Fedus"]
    year: 2022
    venue: "TMLR 2022 (arXiv preprint June 2022)"
    arxiv: "2206.07682"
    url: "https://arxiv.org/abs/2206.07682"
    verified: true
    verified_on: "2026-08-25"
    verified_via: "arXiv abstract page arxiv.org/abs/2206.07682 — title, all sixteen authors, v1 dated 15 June 2022, and the TMLR 2022 venue confirmed on the page."
    contribution: >
      Documented tasks on which performance is near chance for smaller models
      and rises sharply past some scale, and defined an emergent ability as one
      not present in smaller models and not predictable by extrapolating from
      them.
    why_it_mattered: >
      It made unpredictability a named property of scaling, which mattered far
      beyond the technical result — it became a central premise in arguments
      about AI risk and about why capability forecasting is hard.
    what_changed_after: >
      A large literature on emergence, and then a direct challenge in
      schaeffer2023 arguing the phenomenon is an artefact of metric choice.
    descendants: ["schaeffer2023", "capability forecasting", "scaling-law critiques"]

  schaeffer2023:
    title: "Are Emergent Abilities of Large Language Models a Mirage?"
    authors: ["Rylan Schaeffer", "Brando Miranda", "Sanmi Koyejo"]
    year: 2023
    venue: "NeurIPS 2023 (arXiv preprint April 2023)"
    arxiv: "2304.15004"
