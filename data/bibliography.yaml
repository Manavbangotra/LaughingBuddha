      what makes dimension reduction and Matryoshka training reasonable.
    descendants: ["Matryoshka representation learning", "large embedding models"]

  kusupati2022matryoshka:
    title: "Matryoshka Representation Learning"
    authors: ["Aditya Kusupati", "Gantavya Bhatt", "Aniket Rege",
              "Matthew Wallingford", "Aditya Sinha", "Vivek Ramanujan",
              "William Howard-Snyder", "Kaifeng Chen", "Sham Kakade",
