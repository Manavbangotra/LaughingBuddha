    verified: true
    verified_on: "2026-08-27"
    verified_via: "dblp record conf/stoc/IndykM98 — STOC 1998, pages 604-613, two authors confirmed."
    contribution: >
      Locality-sensitive hashing, with the first sublinear-time approximate
      nearest neighbour guarantees in high dimension.
    why_it_mattered: >
      It established that approximation is what buys tractability in high
      dimension — the framing every practical ANN index still operates inside.
    what_changed_after: >
      LSH dominated ANN for a decade before graph methods overtook it
      empirically; the theoretical framing outlasted the algorithm.
    descendants: ["MinHash/SimHash pipelines", "the recall/latency framing of ANN"]

  beyer1999nn:
    title: "When Is Nearest Neighbor Meaningful?"
    authors: ["Kevin Beyer", "Jonathan Goldstein", "Raghu Ramakrishnan",
              "Uri Shaft"]
    year: 1999
    venue: "ICDT 1999, LNCS 1540, pages 217-235"
    url: "https://link.springer.com/chapter/10.1007/3-540-49257-7_15"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "ICDT 1999 proceedings record, LNCS volume 1540, pages 217-235, four authors confirmed."
    contribution: >
      Proved that under broad conditions the distance to the nearest and
      farthest points converges as dimension grows, so nearest-neighbour queries
      become unstable.
    why_it_mattered: >
      It is the precise statement of the curse of dimensionality for retrieval,
      and the reason the concentration result does NOT kill vector search is
      that learned embeddings violate its independence assumptions — a point
      worth making explicitly rather than ignoring the theorem.
    what_changed_after: >
      The field moved to intrinsic rather than ambient dimension as the quantity
      that governs ANN difficulty.
    descendants: ["intrinsic dimension analysis", "ANN hardness characterisation"]

  robertson2009bm25:
    title: "The Probabilistic Relevance Framework: BM25 and Beyond"
