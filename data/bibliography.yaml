  izacard2022atlas:
    title: "Atlas: Few-shot Learning with Retrieval Augmented Language Models"
    authors: ["Gautier Izacard", "Patrick Lewis", "Maria Lomeli",
              "Lucas Hosseini", "Fabio Petroni", "Timo Schick",
              "Jane Dwivedi-Yu", "Armand Joulin", "Sebastian Riedel",
              "Edouard Grave"]
    year: 2022
    venue: "arXiv preprint"
    arxiv: "2208.03299"
    url: "https://arxiv.org/abs/2208.03299"
    verified: true
    verified_on: "2026-08-27"
