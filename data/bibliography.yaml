    contribution: >
      Established that language-model loss follows clean power laws in
      parameters, data and compute over several orders of magnitude, and
      that architectural details like width and depth barely matter within
      a broad range.
    why_it_mattered: >
      Turned model scaling from guesswork into extrapolation, and its
      recommendation — spend a marginal budget mostly on model size —
      directly shaped the GPT-3 generation of models.
    what_changed_after: >
      Scaling laws became the standard planning tool; the specific
      allocation recommendation was overturned two years later by
      hoffmann2022chinchilla.
    descendants: ["GPT-3", "Chinchilla", "all subsequent scaling-law work"]

  hoffmann2022chinchilla:
    title: "Training Compute-Optimal Large Language Models"
    authors: ["Jordan Hoffmann", "Sebastian Borgeaud", "Arthur Mensch",
              "Elena Buchatskaya", "Trevor Cai", "Eliza Rutherford",
              "Diego de Las Casas", "Lisa Anne Hendricks", "Johannes Welbl",
