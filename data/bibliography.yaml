    contribution: >
      The definitive derivation of BM25 from the probabilistic relevance
      framework, including why term-frequency saturation and length
      normalisation take the forms they do.
    why_it_mattered: >
      BM25 remains the baseline every dense retriever is measured against, and
      it still wins on exact-match, rare-term, and out-of-domain queries. The
