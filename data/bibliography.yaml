    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2410.05229 - title, six authors, October 2024; abstract confirms a benchmark generated from symbolic templates, that performance declines for all models when only numerical values change, that adding a single clause irrelevant to the answer causes drops of up to 65% across state-of-the-art models, and the authors' conclusion that models replicate reasoning steps from training data rather than performing logical reasoning."
    contribution: >
      Built the same problems with different names and numbers, and added one
      irrelevant sentence. Performance moved when it should not have, by up to
      65%.
    why_it_mattered: >
      The sharpest available evidence for the reliability gap: a benchmark score
      is a measurement of performance on those exact surface forms, and the
