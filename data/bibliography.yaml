  # --- Part X — Large Language Models -------------------------------------------

  holtzman2020:
    title: "The Curious Case of Neural Text Degeneration"
    authors: ["Ari Holtzman", "Jan Buys", "Li Du", "Maxwell Forbes", "Yejin Choi"]
    year: 2020
    venue: "ICLR 2020 (arXiv preprint April 2019)"
    arxiv: "1904.09751"
