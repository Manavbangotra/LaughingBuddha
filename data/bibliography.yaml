    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/2104.08663 — title, five authors, v1 dated 17 April 2021, NeurIPS 2021 Datasets and Benchmarks acceptance stated on the page."
    contribution: >
      Eighteen retrieval datasets across domains and task types, evaluated
      zero-shot, which exposed that dense retrievers trained on MS MARCO
