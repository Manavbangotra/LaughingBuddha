    descendants: ["hybrid search", "BM25F", "every IR baseline table"]

  cormack2009rrf:
    title: "Reciprocal Rank Fusion outperforms Condorcet and individual Rank Learning Methods"
    authors: ["Gordon V. Cormack", "Charles L. A. Clarke", "Stefan Buettcher"]
    year: 2009
    venue: "SIGIR 2009, pages 758-759"
    url: "https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "dblp record conf/sigir/CormackCB09 and the author-hosted PDF — SIGIR 2009, pages 758-759, three authors confirmed."
    contribution: >
      Reciprocal rank fusion: combine ranked lists by summing 1/(k + rank), a
      one-line method that beat learned rank fusion.
    why_it_mattered: >
      It is what makes hybrid search practical, because it fuses RANKS and so
      needs no score calibration between a BM25 score and a cosine similarity —
      the problem that makes score-based fusion fragile.
    what_changed_after: >
      RRF became the default hybrid fusion method in vector databases and search
      engines, usually with the paper's k=60 unexamined.
    descendants: ["hybrid search in every vector database", "ensemble retrieval"]

  nogueira2019monobert:
    title: "Passage Re-ranking with BERT"
