    verified: true
    verified_on: "2026-08-27"
    verified_via: "ACL Anthology record 2020.findings-emnlp.63 — Findings of EMNLP 2020, pages 708-718, four authors; arXiv 2003.06713 v1 dated 14 March 2020."
    contribution: >
      monoT5: cast reranking as generating the token "true" or "false" and use
      the logit difference as the score, which transfers zero-shot far better
      than a classification head.
    why_it_mattered: >
      It showed relevance can be expressed in the pretraining vocabulary rather
      than in a randomly initialised head, which is why the zero-shot behaviour
      is so much better.
    what_changed_after: >
      Generative reranking became standard, and the technique generalises
      directly to LLM-based rerankers and LLM-as-judge scoring.
    descendants: ["RankT5", "LLM rerankers", "LLM-as-judge relevance scoring"]

  thakur2021beir:
    title: "BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models"
    authors: ["Nandan Thakur", "Nils Reimers", "Andreas Ruckle",
              "Abhishek Srivastava", "Iryna Gurevych"]
