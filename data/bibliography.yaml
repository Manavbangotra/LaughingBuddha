  # --- Part VIII — Natural Language Processing --------------------------------

  gage1994:
    title: "A New Algorithm for Data Compression"
    authors: ["Philip Gage"]
    year: 1994
    venue: "The C Users Journal 12(2), February 1994, pp. 23-38"
    url: "https://dl.acm.org/doi/10.5555/177910.177914"
    verified: true
    verified_on: "2026-08-20"
    verified_via: "ACM Digital Library record dl.acm.org/doi/10.5555/177910.177914 and the archived article PDF at derczynski.com/papers/archive/BPE_Gage.pdf — single author, The C Users Journal volume 12 issue 2, February 1994, pages 23-38 confirmed. NOTE: a print trade-magazine article, not a peer-reviewed venue, and it is about file compression with no linguistic content whatsoever."
    contribution: >
      Described byte pair encoding: repeatedly find the most frequent pair of
      adjacent bytes in a file and replace it with an unused byte, recording
      the substitution in a table, until no pair repeats or the table is full.
    why_it_mattered: >
      It is the exact algorithm that sennrich2016 later applied to text, and
      knowing its origin is the strongest available evidence that subword
      vocabularies are a compression artefact rather than a linguistic model.
    what_changed_after: >
      Nothing, for twenty-one years. The algorithm was a minor entry in the
      compression literature until it was repurposed for machine translation.
    descendants: ["subword tokenization", "byte-level BPE", "every modern LLM tokenizer"]

  sennrich2016:
    title: "Neural Machine Translation of Rare Words with Subword Units"
    authors: ["Rico Sennrich", "Barry Haddow", "Alexandra Birch"]
    year: 2016
    venue: "ACL 2016 (arXiv preprint August 2015)"
    arxiv: "1508.07909"
    url: "https://arxiv.org/abs/1508.07909"
    verified: true
    verified_on: "2026-08-20"
    verified_via: "arXiv abstract page arxiv.org/abs/1508.07909 — title, three authors, v1 dated 31 August 2015 through v5 dated 10 June 2016, ACL 2016 venue confirmed on the page."
    contribution: >
      Applied Gage's byte pair encoding to text as an open-vocabulary solution
      for translation: learn a fixed number of merges over a character-level
      corpus, and segment any word — including one never seen in training —
      into units the model already has embeddings for.
    why_it_mattered: >
      It eliminated the out-of-vocabulary token, which every word-level model
      before it had to handle with a lossy UNK placeholder, and it did so
      without a linguistic morphological analyser.
    what_changed_after: >
      Subword vocabularies became universal. Every production tokenizer since
      is BPE, a BPE variant, or a unigram model competing with it.
    descendants: ["GPT byte-level BPE", "SentencePiece", "WordPiece as a sibling"]

  schuster2012:
    title: "Japanese and Korean Voice Search"
    authors: ["Mike Schuster", "Kaisuke Nakajima"]
    year: 2012
    venue: "ICASSP 2012, pp. 5149-5152"
    url: "https://research.google/pubs/pub37842/"
    verified: true
    verified_on: "2026-08-20"
    verified_via: "Google Research publication record research.google/pubs/pub37842 — two authors, ICASSP (IEEE International Conference on Acoustics, Speech and Signal Processing) 2012, pages 5149-5152 confirmed; corroborated by the ICASSP proceedings listing which gives Kyoto, 25-30 March 2012."
    contribution: >
      Introduced the WordPiece model — a greedy, incrementally-grown word-unit
      inventory initialised from the basic Unicode characters of the target
      script — to handle the effectively infinite vocabulary of Japanese and
      Korean voice search.
    why_it_mattered: >
      It is the origin of the tokenizer BERT and its descendants use, and it
      predates the subword-for-translation literature by three years. The
      motivating problem was speech recognition in scripts without whitespace
      word boundaries, not translation.
    what_changed_after: >
      WordPiece became Google's default text-input representation, carried
      into wu2016's translation system and then into devlin2019bert.
    descendants: ["WordPiece in BERT", "the likelihood-based merge criterion"]

