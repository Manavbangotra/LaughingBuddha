    verified: true
    verified_on: "2026-08-25"
    verified_via: "arXiv abstract page arxiv.org/abs/2304.15004 — title, three authors, v1 dated 28 April 2023 confirmed; abstract confirms the claim that apparent emergence follows from the researcher's choice of metric rather than from a change in model behaviour. The page lists no venue; NeurIPS 2023 is from the proceedings."
    contribution: >
      Argued that emergent abilities appear when a discontinuous metric —
      exact-match accuracy on a multi-step task — is applied to a smoothly
      improving underlying quantity, and showed the sharp curves disappear
      under continuous metrics.
    why_it_mattered: >
      It is the cleanest available demonstration that a measurement choice can
      manufacture a qualitative phenomenon, and it forces any emergence claim
      to state its metric before it can be evaluated.
    what_changed_after: >
      Emergence claims are now expected to report a continuous metric alongside
      the discontinuous one; the debate is not fully settled.
    descendants: ["metric-sensitivity analyses", "continuous evaluation metrics"]

  wei2022flan:
    title: "Finetuned Language Models Are Zero-Shot Learners"
    authors: ["Jason Wei", "Maarten Bosma", "Vincent Y. Zhao", "Kelvin Guu",
              "Adams Wei Yu", "Brian Lester", "Nan Du", "Andrew M. Dai",
