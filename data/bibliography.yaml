  # --- Part IX — Foundation Models ---------------------------------------------

  bommasani2021:
    title: "On the Opportunities and Risks of Foundation Models"
    authors: ["Rishi Bommasani", "Drew A. Hudson", "Ehsan Adeli", "Russ Altman",
              "Simran Arora", "and 123 others"]
    year: 2021
    venue: "Stanford CRFM report (arXiv preprint, not peer-reviewed)"
    arxiv: "2108.07258"
    url: "https://arxiv.org/abs/2108.07258"
    verified: true
    verified_on: "2026-08-25"
    verified_via: "arXiv abstract page arxiv.org/abs/2108.07258 — title and v1 date of 16 August 2021 confirmed; the page lists 114 authors individually plus 14 not shown, 128 in total, from Stanford's Center for Research on Foundation Models. NOTE: a report, not a peer-reviewed paper, and the term it coins is its own."
    contribution: >
      Named the category — a model trained on broad data at scale and adaptable
      to many downstream tasks — and catalogued the capabilities, risks, and
      the homogenisation that follows from many applications sharing one base.
    why_it_mattered: >
      It gave the field a word for what had happened, and its central
      observation is the uncomfortable one: when everything is built on a few
      bases, every defect of a base is inherited by everything above it.
    what_changed_after: >
      "Foundation model" replaced "large pretrained model" as the term of art,
      and the homogenisation argument became the standard framing for systemic
      risk in AI deployment.
    descendants: ["the term itself", "systemic-risk framings", "model-provenance work"]

  brown2020:
    title: "Language Models are Few-Shot Learners"
    authors: ["Tom B. Brown", "Benjamin Mann", "Nick Ryder", "Melanie Subbiah",
              "Jared Kaplan", "Prafulla Dhariwal", "and 25 others"]
    year: 2020
    venue: "NeurIPS 2020 (arXiv preprint May 2020)"
    arxiv: "2005.14165"
    url: "https://arxiv.org/abs/2005.14165"
    verified: true
    verified_on: "2026-08-25"
    verified_via: "arXiv abstract page arxiv.org/abs/2005.14165 — title, 31 authors, v1 dated 28 May 2020 confirmed; abstract confirms GPT-3 at 175B parameters and the claim that scaling improves task-agnostic few-shot performance. The page itself lists no venue; NeurIPS 2020 is from the proceedings."
    contribution: >
      Showed that a sufficiently large language model performs many tasks from
      a prompt containing a few examples, with no gradient updates at all —
      turning task adaptation from a training problem into an inference one.
    why_it_mattered: >
      In-context learning is the interface every subsequent product is built
      on. It also made model scale, rather than task-specific engineering, the
      obvious lever, which set the field's direction for years.
    what_changed_after: >
      Prompting became a discipline, fine-tuning became optional for many
      tasks, and the API-served general model became the dominant deployment
      shape.
    descendants: ["prompting", "in-context learning research", "instruction tuning"]

  wei2022emergent:
