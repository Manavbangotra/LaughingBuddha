  kojima2022zeroshotcot:
    title: "Large Language Models are Zero-Shot Reasoners"
    authors: ["Takeshi Kojima", "Shixiang Shane Gu", "Machel Reid",
              "Yutaka Matsuo", "Yusuke Iwasawa"]
    year: 2022
    venue: "NeurIPS 2022 (arXiv preprint May 2022)"
    arxiv: "2205.11916"
    url: "https://arxiv.org/abs/2205.11916"
    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2205.11916 - title, five authors, submitted 24 May 2022, accepted to NeurIPS 2022; abstract confirms that appending a single step-by-step instruction phrase before the answer elicits multi-step reasoning with no exemplars, and the reported numbers on text-davinci-002 - MultiArith 17.7% to 78.7% and GSM8K 10.4% to 40.7% - with similar magnitudes on 540B PaLM."
    contribution: >
      Showed the behaviour needs no exemplars - a single instruction phrase
      elicits it - which separates the CAPABILITY from the demonstration format
      that had been assumed to install it.
    why_it_mattered: >
      If exemplars were doing the work, chain-of-thought would be in-context
      learning. The zero-shot result says the capability is already present and
      the prompt only routes to it, which is a different claim about what
      pretraining produced.
    what_changed_after: >
      Step-by-step instructions entered every system prompt, and the question
      shifted from how to teach the behaviour to how to elicit and then train
      it in.
    descendants: ["zero-shot CoT", "reasoning system prompts",
                  "instruction-elicited reasoning"]

  madaan2023selfrefine:
    title: "Self-Refine: Iterative Refinement with Self-Feedback"
    authors: ["Aman Madaan", "Niket Tandon", "Prakhar Gupta",
              "Skyler Hallinan", "Luyu Gao", "Sarah Wiegreffe", "Uri Alon",
              "Nouha Dziri", "Shrimai Prabhumoye", "Yiming Yang",
