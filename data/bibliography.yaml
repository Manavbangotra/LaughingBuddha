    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2303.17651 - title, sixteen authors, March 2023; abstract confirms that a single LLM acts as generator, refiner and feedback provider with no supervised data, training or RL, evaluation across 7 tasks from dialogue response generation to mathematical reasoning on GPT-3.5, ChatGPT and GPT-4, and the reported average improvement of about 20% absolute in task performance over conventional one-step generation."
    contribution: >
      The canonical positive claim for intrinsic self-correction: one model as
