    verified_via: "arXiv abstract page arxiv.org/abs/2205.11916 — title, five authors, v1 dated 24 May 2022, page states 'Accepted to NeurIPS2022'."
    contribution: >
      Showed that appending a single instruction — "Let's think step by step" —
      elicits multi-step reasoning with no exemplars at all, recovering much of
