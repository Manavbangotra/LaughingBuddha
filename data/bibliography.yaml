  ni2021gtr:
    title: "Large Dual Encoders Are Generalizable Retrievers"
    authors: ["Jianmo Ni", "Chen Qu", "Jing Lu", "Zhuyun Dai",
              "Gustavo Hernandez Abrego", "Ji Ma", "Vincent Y. Zhao",
              "Yi Luan", "Keith B. Hall", "Ming-Wei Chang", "Yinfei Yang"]
    year: 2021
