    descendants: ["adaptive retrieval", "truncatable embedding APIs"]

  malkov2014nsw:
    title: "Approximate nearest neighbor algorithm based on navigable small world graphs"
    authors: ["Yury Malkov", "Alexander Ponomarenko", "Andrey Logvinov",
