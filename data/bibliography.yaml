    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/1702.08734 — title, three authors, v1 dated 28 February 2017 confirmed; the page lists no venue."
    contribution: >
      The FAISS design: GPU k-selection, IVF partitioning, and PQ compression
      combined into a library that made billion-vector search routine.
    why_it_mattered: >
      FAISS is the reference implementation almost everything else is compared
      against, and the paper is where the IVF+PQ composition is described as an
