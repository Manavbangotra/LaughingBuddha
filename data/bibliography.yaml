    contribution: >-
      Replaced ridge's L2 penalty with an L1 penalty, which shrinks coefficients
      and sets many of them to exactly zero — performing estimation and variable
      selection in a single convex optimisation.
    why_it_mattered: >-
      Sparsity became something you could obtain by optimisation rather than by
      combinatorial search over subsets, which had been intractable beyond a few
      dozen features. It also made regression usable when the number of features
      exceeds the number of observations.
    what_changed_after: >-
      A large literature on sparse estimation and compressed sensing followed,
      and L1 regularisation became a standard tool wherever an interpretable
      subset of inputs is wanted.
    descendants: ["elastic net", "group lasso", "LARS",
