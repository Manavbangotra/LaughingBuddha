    contribution: >
      GTR: showed that scaling the dual encoder while HOLDING the embedding
      dimension fixed improves out-of-domain retrieval substantially.
    why_it_mattered: >
      It separates two things practitioners routinely conflate — model capacity
      and vector width — and shows the generalisation gain comes from the first.
      Index cost depends only on the second.
    what_changed_after: >
