    contribution: >
      Showed that quantization for maximum inner product search should penalise
      the error component PARALLEL to the datapoint more than the orthogonal
      one, because only the parallel part changes the inner product.
    why_it_mattered: >
      It is the clearest statement that reconstruction error is the wrong
      objective when the downstream operation is a dot product — a general
      lesson that applies well beyond ANN.
    what_changed_after: >
      Score-aware quantization loss became standard; ScaNN held the top of the
      ANN benchmarks for years.
    descendants: ["ScaNN", "score-aware quantization", "MIPS-specific indexes"]

  indyk1998lsh:
    title: "Approximate Nearest Neighbors: Towards Removing the Curse of Dimensionality"
    authors: ["Piotr Indyk", "Rajeev Motwani"]
    year: 1998
    venue: "STOC 1998, pages 604-613"
