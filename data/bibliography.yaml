    contribution: >
      Freeze the pretrained weights and train a low-rank update alongside them,
      on the hypothesis that the weight CHANGE required by adaptation has low
      intrinsic rank even when the weights do not.
    why_it_mattered: >
      It made adapting a large model a consumer-hardware operation, and because
      the update is a separate small object, one base model can serve many
      adaptations without duplicating it.
    what_changed_after: >
      Fine-tuning stopped meaning "make a copy of the model" and started meaning
      "produce an adapter", which changed how models are served as much as how
      they are trained.
