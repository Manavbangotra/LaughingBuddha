# =============================================================================
#  bibliography.yaml — the book's single source of citation truth.
#
#  `verified: true` means title, authors, year and identifier were checked
#  against a primary source (the arXiv abstract page, publisher record, or
#  proceedings listing) on `verified_on`, and `verified_via` names that source.
#  Anything else renders in the text as [UNVERIFIED] and is reported by
#  `make check`. Nothing is ever cited from memory.
#
#  The four narrative fields — contribution, why_it_mattered, what_changed_after,
#  descendants — are required for any work the book discusses rather than merely
#  cites. The annotated-bibliography appendix is generated from them.
# =============================================================================

entries:

  bahdanau2015:
    title: "Neural Machine Translation by Jointly Learning to Align and Translate"
    authors: ["Dzmitry Bahdanau", "Kyunghyun Cho", "Yoshua Bengio"]
    year: 2015
    venue: "ICLR 2015"
    arxiv: "1409.0473"
    url: "https://arxiv.org/abs/1409.0473"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/1409.0473 (v1 2014-09-01; ICLR 2015 oral)"
    contribution: >-
      Introduced additive (concatenative) attention: rather than compressing a
      source sentence into one fixed vector, the decoder learns a soft alignment
      and reads a different weighted combination of encoder states at every
      output step.
    why_it_mattered: >-
      It identified the fixed-length bottleneck as the reason encoder-decoder
      translation degraded on long sentences, and showed that a differentiable,
      content-based read fixes it. Every later attention mechanism is a variation
      on this idea.
    what_changed_after: >-
      Attention went from a niche addition to a standard component of sequence
      models, and the notion of a learned soft alignment became the substrate
      the Transformer would later build on exclusively.
    descendants: ["Luong attention", "Transformer self-attention", "cross-attention in VLMs"]

  luong2015:
    title: "Effective Approaches to Attention-based Neural Machine Translation"
    authors: ["Minh-Thang Luong", "Hieu Pham", "Christopher D. Manning"]
    year: 2015
    venue: "EMNLP 2015"
    arxiv: "1508.04025"
    url: "https://arxiv.org/abs/1508.04025"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/1508.04025 (v1 2015-08-17; EMNLP 2015)"
    contribution: >-
      Systematised attention scoring functions, and showed that a plain dot
      product between decoder and encoder states works as well as Bahdanau's
      learned additive network while being cheaper.
    why_it_mattered: >-
      It established multiplicative scoring as the practical default, which is
      the direct ancestor of the dot-product score inside scaled dot-product
      attention.
    what_changed_after: >-
      Dot-product scoring became the standard, and the remaining question was
      how to keep its variance under control at higher dimension.
    descendants: ["Scaled dot-product attention"]

  sukhbaatar2015:
    title: "End-To-End Memory Networks"
    authors: ["Sainbayar Sukhbaatar", "Arthur Szlam", "Jason Weston", "Rob Fergus"]
    year: 2015
    venue: "NIPS 2015"
    arxiv: "1503.08895"
    url: "https://arxiv.org/abs/1503.08895"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/1503.08895 (v1 2015-03-31; NIPS 2015)"
    contribution: >-
      Formulated memory access as a differentiable, content-addressed lookup in
      which one embedding of a memory item is used for matching against the
      query and a second, separate embedding is used for what gets returned.
    why_it_mattered: >-
      That separation of the matching representation from the returned
      representation is exactly the key/value split, arrived at before the
      terminology existed.
    what_changed_after: >-
      Content-based addressing with distinct key and value projections became
      the standard formulation of neural memory read operations.
    descendants: ["Query-key-value attention", "retrieval-augmented architectures"]

  vaswani2017:
    title: "Attention Is All You Need"
    authors: ["Ashish Vaswani", "Noam Shazeer", "Niki Parmar", "Jakob Uszkoreit",
              "Llion Jones", "Aidan N. Gomez", "Łukasz Kaiser", "Illia Polosukhin"]
    year: 2017
    venue: "NeurIPS 2017"
    arxiv: "1706.03762"
    url: "https://arxiv.org/abs/1706.03762"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/1706.03762 (v1 2017-06-12)"
    contribution: >-
      Introduced the Transformer: a sequence-transduction architecture built
      entirely from attention and position-wise feed-forward layers, with no
      recurrence and no convolution. Named and motivated scaled dot-product
      attention and multi-head attention.
    why_it_mattered: >-
      Removing sequential dependence along the time axis made the forward and
      backward passes parallel across sequence positions. That, rather than any
      accuracy result in the paper, is what allowed model and data scale to grow
      by orders of magnitude over the following years.
    what_changed_after: >-
      Effectively every large language model, and most modern vision, audio and
      multimodal models, are Transformer variants. Research shifted from
      designing architectures to scaling one architecture.
    descendants: ["BERT", "GPT-family models", "Vision Transformer", "T5",
                  "modern multimodal and reasoning models"]

  shazeer2019:
    title: "Fast Transformer Decoding: One Write-Head is All You Need"
    authors: ["Noam Shazeer"]
    year: 2019
    venue: null
    arxiv: "1911.02150"
    url: "https://arxiv.org/abs/1911.02150"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/1911.02150 (v1 2019-11-06; preprint, no venue listed)"
    contribution: >-
      Introduced multi-query attention: keep h separate query projections but
      share a single key and value head across all of them, shrinking the
      per-token KV cache by a factor of h.
    why_it_mattered: >-
      It reframed decoding cost as a memory-bandwidth problem rather than an
      arithmetic one, which is the correct framing for autoregressive inference
      and the basis of most serving optimisation since.
    what_changed_after: >-
      KV-cache size became a first-class architectural constraint, chosen at
      design time rather than discovered at deployment time.
    descendants: ["Grouped-query attention", "multi-head latent attention",
                  "paged KV caches"]

  dao2022:
    title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness"
    authors: ["Tri Dao", "Daniel Y. Fu", "Stefano Ermon", "Atri Rudra",
              "Christopher Ré"]
    year: 2022
    venue: "NeurIPS 2022"
    arxiv: "2205.14135"
    url: "https://arxiv.org/abs/2205.14135"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/2205.14135 (v1 2022-05-27)"
    contribution: >-
      Computed exact attention without ever materialising the n×n score matrix
      in high-bandwidth memory, by tiling the computation into on-chip SRAM and
      using the online-softmax recurrence to combine tiles.
    why_it_mattered: >-
      It separated two things the field had conflated: attention's quadratic
      *arithmetic* cost, which is unavoidable for exact attention, and its
      quadratic *memory* cost, which is an artefact of a naive implementation.
      Long contexts became practical without approximating attention.
    what_changed_after: >-
      IO-aware kernel design became standard practice, and the many
      approximate-attention schemes proposed to save memory largely lost their
      motivation.
    descendants: ["FlashAttention-2 and -3", "fused attention kernels in
                  mainstream serving stacks", "paged attention"]

  # ---------------------------------------------------------------------------
  # Part I — Mathematical Foundations
  #
  # Deliberately sparse. Standard mathematics has no "original paper" a reader
  # should be sent to, and inventing citations for it would be dishonest. The
  # two research citations below are here because their origin genuinely
  # explains something the reader will otherwise take on faith.
  # ---------------------------------------------------------------------------

  deisenroth2020:
    title: "Mathematics for Machine Learning"
    authors: ["Marc Peter Deisenroth", "A. Aldo Faisal", "Cheng Soon Ong"]
    year: 2020
    venue: "Cambridge University Press"
    url: "https://mml-book.github.io/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Official book site mml-book.github.io — authors, publisher, year and free PDF availability confirmed"
    contribution: >-
      A self-contained treatment of exactly the linear algebra, analytic
      geometry, probability and optimisation that machine learning uses, with a
      second half deriving standard ML methods from that foundation.
    why_it_mattered: >-
      It replaced the awkward advice to read three unrelated undergraduate
      textbooks and work out which parts mattered. It is also free, which is why
      this book recommends it as the companion volume for Part I.
    descendants: []

  boyd2004:
    title: "Convex Optimization"
    authors: ["Stephen Boyd", "Lieven Vandenberghe"]
    year: 2004
    venue: "Cambridge University Press"
    doi: "10.1017/CBO9780511804441"
    url: "https://web.stanford.edu/~boyd/cvxbook/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Cambridge Core record (ISBN 9780511804441, DOI 10.1017/CBO9780511804441) and the authors' Stanford page"
    contribution: >-
      Established convex optimisation as a single coherent subject with a
      recognisable set of problem classes, and made the boundary between
      tractable and intractable optimisation legible to practitioners.
    why_it_mattered: >-
      It gives the vocabulary for saying precisely why convex problems are
      solvable and neural-network training is not, which is the distinction
      Chapter 12 of this book turns on.
    descendants: []

  goodfellow2016:
    title: "Deep Learning"
    authors: ["Ian Goodfellow", "Yoshua Bengio", "Aaron Courville"]
    year: 2016
    venue: "MIT Press"
    url: "https://www.deeplearningbook.org/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Official site deeplearningbook.org — authors, publisher, year and free online availability confirmed"
    contribution: >-
      The first comprehensive graduate textbook of deep learning, including a
      mathematical-preliminaries section that fixed much of the notation the
      field now uses.
    why_it_mattered: >-
      It standardised vocabulary and notation across a field that had been
      accumulating both haphazardly. Predates the Transformer, so Parts VII
      onward of this book have no counterpart in it.
    descendants: []

  robbins1951:
    title: "A Stochastic Approximation Method"
    authors: ["Herbert Robbins", "Sutton Monro"]
    year: 1951
    venue: "The Annals of Mathematical Statistics 22(3), 400-407"
    doi: "10.1214/aoms/1177729586"
    url: "https://doi.org/10.1214/aoms/1177729586"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Project Euclid record — journal, volume 22, issue 3, pages 400-407, DOI 10.1214/aoms/1177729586"
    contribution: >-
      Showed that a root of an unknown function can be found from noisy
      evaluations alone, provided the step sizes are square-summable but not
      summable.
    why_it_mattered: >-
      This is the theoretical origin of stochastic gradient descent, six decades
      before it trained neural networks, and its step-size conditions are why
      learning-rate schedules decay the way they do.
    what_changed_after: >-
      Optimisation from noisy samples became a rigorous subject rather than a
      heuristic, and the conditions derived here still bound what any
      minibatch method can guarantee.
    descendants: ["Stochastic gradient descent", "Adam and adaptive methods",
                  "learning-rate schedules"]

  kingma2015:
    title: "Adam: A Method for Stochastic Optimization"
    authors: ["Diederik P. Kingma", "Jimmy Ba"]
    year: 2015
    venue: "ICLR 2015"
    arxiv: "1412.6980"
    url: "https://arxiv.org/abs/1412.6980"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "arXiv abstract page arxiv.org/abs/1412.6980 (v1 2014-12-22; ICLR 2015, San Diego)"
    contribution: >-
      Combined momentum with per-parameter adaptive step sizes estimated from
      running first and second moments of the gradient, with bias correction for
      the initial steps.
    why_it_mattered: >-
      It made training deep networks far less sensitive to the learning rate,
      which in practice is what let practitioners stop tuning optimisers and
      start changing architectures.
    what_changed_after: >-
      Adam and its variants became the default optimiser for nearly all deep
      learning, and plain SGD became the specialist choice rather than the norm.
    descendants: ["AdamW", "Adafactor", "Lion", "modern optimiser families"]

  strang2010:
    title: "MIT 18.06 Linear Algebra (Spring 2010)"
    authors: ["Gilbert Strang"]
    year: 2010
    venue: "MIT OpenCourseWare"
    url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "MIT OpenCourseWare course page — course number, instructor, Spring 2010 term, CC BY-NC-SA 4.0 licence"
    contribution: >-
      A complete undergraduate linear algebra course, freely available in full,
      organised around the four fundamental subspaces and matrix factorisations
      rather than around determinants.
    why_it_mattered: >-
      The factorisation-first framing is the one that transfers to machine
      learning, and this course is the most accessible place to absorb it.
    descendants: []

  # ---------------------------------------------------------------------------
  # Part II — Python for Data and AI
  # ---------------------------------------------------------------------------

  harris2020:
    title: "Array programming with NumPy"
    authors: ["Charles R. Harris", "K. Jarrod Millman", "Stéfan J. van der Walt",
              "Ralf Gommers", "Pauli Virtanen", "David Cournapeau",
              "Eric Wieser", "Julian Taylor", "Sebastian Berg",
              "Nathaniel J. Smith", "Robert Kern", "Matti Picus",
              "Stephan Hoyer", "Marten H. van Kerkwijk", "Matthew Brett",
              "Allan Haldane", "Jaime Fernández del Río", "Mark Wiebe",
              "Pearu Peterson", "Pierre Gérard-Marchant", "Kevin Sheppard",
              "Tyler Reddy", "Warren Weckesser", "Hameer Abbasi",
              "Christoph Gohlke", "Travis E. Oliphant"]
    year: 2020
    venue: "Nature 585(7825), 357-362"
    doi: "10.1038/s41586-020-2649-2"
    url: "https://doi.org/10.1038/s41586-020-2649-2"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Official citation page numpy.org/citing-numpy (Nature paywalled; the project's own page is authoritative for its citation) — full author list, volume, pages, DOI"
    contribution: >-
      The reference description of NumPy's array programming model: the
      n-dimensional array, dtypes, broadcasting, views, and vectorised
      operations over contiguous memory.
    why_it_mattered: >-
      NumPy's array is the common data structure the entire scientific Python
      ecosystem agreed on. Pandas, SciPy, scikit-learn, Matplotlib and every
      deep-learning framework interoperate because they all speak this one
      interface.
    what_changed_after: >-
      Python became viable for numerical work at scale, which is the
      precondition for it becoming the language of machine learning.
    descendants: ["pandas", "SciPy", "scikit-learn", "PyTorch tensors",
                  "the Array API standard"]

  mckinney2010:
    title: "Data Structures for Statistical Computing in Python"
    authors: ["Wes McKinney"]
    year: 2010
    venue: "Proceedings of the 9th Python in Science Conference, 56-61"
    doi: "10.25080/Majora-92bf1922-00a"
    url: "https://doi.org/10.25080/Majora-92bf1922-00a"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Official citation page pandas.pydata.org/about/citing.html — title, proceedings, pages 56-61, editors, DOI"
    contribution: >-
      Introduced the pandas DataFrame: a labelled, heterogeneously-typed tabular
      structure with an index, built on NumPy arrays, with alignment semantics
      and relational operations.
    why_it_mattered: >-
      It gave Python the tabular data structure R had, which is what made Python
      a plausible language for data analysis rather than only for numerics.
    what_changed_after: >-
      The DataFrame became the default in-memory representation for tabular data
      in Python, and the interface later systems were measured against.
    descendants: ["Polars", "Dask DataFrame", "PySpark DataFrame",
                  "the Arrow-backed pandas 2.x internals"]

  hunter2007:
    title: "Matplotlib: A 2D Graphics Environment"
    authors: ["John D. Hunter"]
    year: 2007
    venue: "Computing in Science & Engineering 9(3), 90-95"
    doi: "10.1109/MCSE.2007.55"
    url: "https://doi.org/10.1109/MCSE.2007.55"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record api.crossref.org/works/10.1109/MCSE.2007.55 (IEEE Xplore returned 403) — title, author, journal, volume 9 issue 3, pages 90-95, year"
    contribution: >-
      A publication-quality plotting library for Python with a scriptable
      object model and multiple rendering backends.
    why_it_mattered: >-
      It removed the last practical reason to leave Python for analysis work,
      and its object model is what almost every later Python plotting library
      either builds on or defines itself against.
    descendants: ["seaborn", "pandas .plot", "plotnine"]

  pep8:
    title: "PEP 8 – Style Guide for Python Code"
    authors: ["Guido van Rossum", "Barry Warsaw", "Alyssa Coghlan"]
    year: 2001
    venue: "Python Enhancement Proposals"
    url: "https://peps.python.org/pep-0008/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "peps.python.org/pep-0008 — authors, created 05-Jul-2001, Status: Active"
    contribution: >-
      The community's shared style conventions for Python code: naming,
      indentation, line length, imports, and whitespace.
    why_it_mattered: >-
      Near-universal adoption means Python code from unrelated projects reads
      alike, which lowers the cost of moving between codebases. It is also the
      specification that automated formatters implement.
    descendants: ["black", "ruff format", "the formatting defaults of most linters"]

  pep484:
    title: "PEP 484 – Type Hints"
    authors: ["Guido van Rossum", "Jukka Lehtosalo", "Łukasz Langa"]
    year: 2014
    venue: "Python Enhancement Proposals (targets Python 3.5)"
    url: "https://peps.python.org/pep-0484/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "peps.python.org/pep-0484 — authors, Python-Version 3.5, created 29-Sep-2014, Status: Final"
    contribution: >-
      A standard syntax for annotating types in Python, with a `typing` module
      providing generics, unions and related constructs. Annotations are not
      enforced at runtime.
    why_it_mattered: >-
      It made static analysis of Python practical, which matters most in exactly
      the situation this book cares about: large codebases where a tensor of the
      wrong shape surfaces as a crash forty minutes into a training run.
    descendants: ["mypy", "pyright", "runtime validators such as Pydantic",
                  "typed tensor-shape checkers"]

  pep703:
    title: "PEP 703 – Making the Global Interpreter Lock Optional in CPython"
    authors: ["Sam Gross"]
    year: 2023
    venue: "Python Enhancement Proposals (first target: Python 3.13)"
    url: "https://peps.python.org/pep-0703/"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "peps.python.org/pep-0703 — author Sam Gross, sponsor Łukasz Langa, Status: Final, Python-Version 3.13, experimental --disable-gil build"
    contribution: >-
      A build configuration that removes the global interpreter lock, using
      biased and deferred reference counting, immortal objects, mimalloc and
      per-object locking to keep the interpreter thread-safe without it.
    why_it_mattered: >-
      The GIL has shaped how Python programs are structured for three decades —
      threads for I/O, processes for CPU. Removing it changes that default,
      though the transition is deliberately gradual.
    what_changed_after: >-
      Free-threaded builds exist and are being tested, at a reported 5-6%
      single-threaded overhead. Standard builds are unchanged, so the practical
      advice has not yet moved for most readers.
    descendants: ["free-threaded CPython builds", "per-interpreter GIL work"]

  # ---------------------------------------------------------------------------
  # Part III — Data Science
  # ---------------------------------------------------------------------------

  wickham2014:
    title: "Tidy Data"
    authors: ["Hadley Wickham"]
    year: 2014
    venue: "Journal of Statistical Software 59(10)"
    doi: "10.18637/jss.v059.i10"
    url: "https://doi.org/10.18637/jss.v059.i10"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.18637/jss.v059.i10 — title, author, journal, volume 59 issue 10, year"
    contribution: >-
      Defined a standard shape for tabular data: one variable per column, one
      observation per row, one table per kind of observational unit — and
      named the small set of operations that convert messy data into it.
    why_it_mattered: >-
      It turned "cleaning the data" from an unstructured chore into a
      transformation with a stated target, which is what made data-preparation
      tooling composable.
    descendants: ["tidyverse", "pandas melt/pivot idioms", "long-format
                  conventions in plotting libraries"]

  kaufman2012:
    title: "Leakage in data mining: Formulation, detection, and avoidance"
    authors: ["Shachar Kaufman", "Saharon Rosset", "Claudia Perlich",
              "Ori Stitelman"]
    year: 2012
    venue: "ACM Transactions on Knowledge Discovery from Data 6(4), 1-21"
    doi: "10.1145/2382577.2382579"
    url: "https://doi.org/10.1145/2382577.2382579"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.1145/2382577.2382579 — title, four authors, TKDD volume 6 issue 4, pages 1-21, year"
    contribution: >-
      Gave leakage a precise formulation — information available to the model
      at training time that will not be available at prediction time — and a
      taxonomy of the mechanisms by which it enters, with detection strategies.
    why_it_mattered: >-
      Leakage is the most common reason a model that performs excellently in
      development fails in production, and before this paper it was folklore
      rather than a named, diagnosable failure.
    what_changed_after: >-
      Leakage checks became a standard part of competent evaluation design, and
      the term entered general use.
    descendants: ["temporal validation splits", "group-aware cross-validation",
                  "fit-on-train-only pipeline discipline"]

  chawla2002:
    title: "SMOTE: Synthetic Minority Over-sampling Technique"
    authors: ["N. V. Chawla", "K. W. Bowyer", "L. O. Hall", "W. P. Kegelmeyer"]
    year: 2002
    venue: "Journal of Artificial Intelligence Research 16, 321-357"
    doi: "10.1613/jair.953"
    url: "https://doi.org/10.1613/jair.953"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.1613/jair.953 — title, four authors, JAIR volume 16, pages 321-357, year"
    contribution: >-
      Proposed generating synthetic minority-class examples by interpolating
      between a minority point and its nearest minority neighbours, rather than
      duplicating existing points.
    why_it_mattered: >-
      It became the default response to class imbalance for a decade. Its
      limitations — interpolating in feature space can create points in regions
      no real example occupies, and it must never be applied before the split —
      are as instructive as the method.
    descendants: ["Borderline-SMOTE", "ADASYN", "class-weighted losses",
                  "threshold tuning as the simpler alternative"]

  koren2009:
    title: "Matrix Factorization Techniques for Recommender Systems"
    authors: ["Yehuda Koren", "Robert Bell", "Chris Volinsky"]
    year: 2009
    venue: "Computer 42(8), 30-37"
    doi: "10.1109/MC.2009.263"
    url: "https://doi.org/10.1109/MC.2009.263"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.1109/MC.2009.263 — title, three authors, IEEE Computer volume 42 issue 8, pages 30-37, year"
    contribution: >-
      The accessible account of the latent-factor methods that won the Netflix
      Prize: represent users and items as vectors in a shared low-dimensional
      space and predict a rating as their inner product, with bias terms and
      regularisation.
    why_it_mattered: >-
      It established the embedding-plus-inner-product formulation that
      underlies modern retrieval and recommendation, and it is the clearest
      early example of learning representations rather than engineering
      features.
    what_changed_after: >-
      Latent factors displaced neighbourhood methods as the default, and the
      user/item embedding pattern generalised into the two-tower architectures
      used for retrieval today.
    descendants: ["implicit-feedback ALS", "two-tower retrieval models",
                  "embedding-based candidate generation"]

  kohavi2009:
    title: "Controlled experiments on the web: survey and practical guide"
    authors: ["Ron Kohavi", "Roger Longbotham", "Dan Sommerfield",
              "Randal M. Henne"]
    year: 2009
    venue: "Data Mining and Knowledge Discovery 18(1), 140-181"
    doi: "10.1007/s10618-008-0114-1"
    url: "https://doi.org/10.1007/s10618-008-0114-1"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.1007/s10618-008-0114-1 — title, four authors, DMKD volume 18 issue 1, pages 140-181, year"
    contribution: >-
      A practitioner's account of running randomised controlled experiments on
      web traffic at scale: randomisation units, the pitfalls that invalidate
      results, and the organisational practices that make experimentation
      trustworthy.
    why_it_mattered: >-
      It moved online experimentation from ad-hoc comparison to a discipline
      with named failure modes, and documented the uncomfortable finding that
      most tested ideas do not improve the metric they target.
    descendants: ["modern experimentation platforms", "sequential and
                  always-valid testing", "guardrail-metric practice"]

  simpson1951:
    title: "The Interpretation of Interaction in Contingency Tables"
