    what_changed_after: >
      Explicit thinking budgets became a serving parameter, and small
      reasoning-trace datasets became a normal way to add the behaviour.
    descendants: ["thinking budgets", "budget forcing", "reasoning distillation"]

  nye2021scratchpads:
    title: "Show Your Work: Scratchpads for Intermediate Computation with Language Models"
    authors: ["Maxwell Nye", "Anders Johan Andreassen", "Guy Gur-Ari",
              "Henryk Michalewski", "Jacob Austin", "David Bieber",
              "David Dohan", "Aitor Lewkowycz", "Maarten Bosma", "David Luan",
              "Charles Sutton", "Augustus Odena"]
    year: 2021
    venue: "arXiv preprint (November 2021)"
    arxiv: "2112.00114"
    url: "https://arxiv.org/abs/2112.00114"
    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2112.00114 - title, twelve authors, submitted 30 November 2021; abstract confirms the framing that models do well on tasks doable in one pass but struggle with unbounded multi-step computation such as integer addition and program execution, and that emitting intermediate steps into a scratchpad dramatically improves multi-step computation across tasks from long addition to arbitrary program execution."
    contribution: >
      Named the mechanism before the prompting result made it famous. Emitting
      intermediate computation into the sequence turns a one-pass problem into a
      multi-pass one, and the paper demonstrates it on tasks where the required
      number of steps is explicit rather than on benchmark deltas.
    why_it_mattered: >
      It is the correct framing of chain-of-thought - a working-memory and
      serial-computation argument rather than a prompting trick - and it arrived
      with tasks where the claim is checkable.
    what_changed_after: >
      Every later analysis of why intermediate tokens help traces back to this
      formulation, and the theory papers that followed are formalisations of it.
    descendants: ["chain-of-thought prompting", "expressivity results for CoT",
                  "reasoning traces"]

  merrill2024cotexpressive:
    title: "The Expressive Power of Transformers with Chain of Thought"
    authors: ["William Merrill", "Ashish Sabharwal"]
    year: 2023
    venue: "ICLR 2024 (arXiv preprint October 2023)"
    arxiv: "2310.07923"
    url: "https://arxiv.org/abs/2310.07923"
    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2310.07923 - title, two authors, submitted 11 October 2023 with a final version April 2024; abstract confirms that standard transformers answering immediately cannot solve problems such as graph connectivity or finite-state-machine simulation, that intermediate generation does extend computational power, and the specific scaling results - logarithmic decoding steps extend the class only slightly, linear steps with projected pre-norm add recognition of all regular languages and keep decoders within context-sensitive languages, and polynomial steps yield exactly the polynomial-time-solvable class."
    contribution: >
      The precise version of "intermediate tokens buy serial steps" - the
      computational class a decoder can recognise is a function of HOW MANY
      intermediate tokens it generates, with logarithmic, linear and polynomial
      budgets landing in distinguishable places.
    why_it_mattered: >
      Turns an intuition into a theorem, and in doing so explains why the benefit
      of chain-of-thought is bounded rather than open-ended - the number of
      tokens, not the model, is the resource being spent.
    what_changed_after: >
      Reasoning length became something to reason about quantitatively, and
      test-time compute scaling acquired a theoretical account of what it buys.
    descendants: ["test-time compute scaling", "thinking budgets",
                  "serial-computation analyses of reasoning"]

  lanham2023faithfulness:
    title: "Measuring Faithfulness in Chain-of-Thought Reasoning"
    authors: ["Tamera Lanham", "Anna Chen", "Ansh Radhakrishnan",
              "Benoit Steiner", "Carson Denison", "Danny Hernandez",
              "Dustin Li", "Esin Durmus", "Evan Hubinger", "Jackson Kernion",
