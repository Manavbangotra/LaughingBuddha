    venue: "arXiv preprint (ACL 2023)"
    arxiv: "2212.10496"
    url: "https://arxiv.org/abs/2212.10496"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/2212.10496 — title, four authors, v1 dated 20 December 2022 confirmed; the page lists no venue."
    contribution: >
      HyDE: generate a HYPOTHETICAL answer document with an LLM, embed that
      instead of the query, and retrieve with it.
    why_it_mattered: >
      It attacks the query/document asymmetry directly — a question and its
      answer look nothing alike, and a fabricated answer looks like the real
