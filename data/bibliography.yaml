    verified: true
    verified_on: "2026-08-26"
    verified_via: "arXiv abstract page arxiv.org/abs/1904.09751 — title, five authors, v1 dated 22 April 2019, ICLR 2020 venue confirmed on the page."
    contribution: >
      Diagnosed why maximum-likelihood decoding produces degenerate repetitive
      text despite the model assigning it low probability, and introduced
      nucleus (top-p) sampling — truncating to the smallest set of tokens whose
      cumulative probability exceeds p.
    why_it_mattered: >
      It established that the decoding strategy is a separate design decision
      from the model, and that the highest-probability sequence is not the one
      anyone wants. Every production sampler descends from this paper.
    what_changed_after: >
      Top-p became the default sampling method, and "likelihood is not quality"
      became a standard caveat in generation work.
    descendants: ["nucleus sampling", "typical sampling", "min-p", "every modern sampler"]

