    contribution: >-
      Showed that random search over hyperparameters is more efficient than
      grid search at equal budget, and gave the geometric reason: when only a
      few of the hyperparameters matter, a grid wastes most of its trials
      re-testing the same values of the important ones.
    why_it_mattered: >-
      It replaced a universal default with a better one on the strength of an
