  breiman2001rf:
    title: "Random Forests"
    authors: ["Leo Breiman"]
    year: 2001
    venue: "Machine Learning 45(1), 5-32"
    doi: "10.1023/A:1010933404324"
    url: "https://doi.org/10.1023/A:1010933404324"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.1023/A:1010933404324 — title, author, Machine Learning volume 45 issue 1, pages 5-32, year"
    contribution: >-
      Combined bootstrap aggregation with random feature subsampling at each
      split, so that the trees in an ensemble are decorrelated rather than
      merely different, and showed the generalisation error converges as trees
      are added.
    why_it_mattered: >-
      It made a high-variance, low-bias learner into one of the most reliable
      general-purpose methods available, requiring almost no tuning — and the
      decorrelation argument is the clearest demonstration that ensemble
      diversity, not individual accuracy, is what averaging exploits.
    what_changed_after: >-
      Random forests became the default strong baseline for tabular problems for
      a decade, until gradient boosting displaced them on accuracy.
    descendants: ["Extremely randomized trees", "gradient-boosted ensembles",
                  "feature-importance practice"]

  breiman2001cultures:
    title: "Statistical Modeling: The Two Cultures"
    authors: ["Leo Breiman"]
    year: 2001
    venue: "Statistical Science 16(3)"
    doi: "10.1214/ss/1009213726"
    url: "https://doi.org/10.1214/ss/1009213726"
    verified: true
    verified_on: "2026-08-13"
    verified_via: "Crossref API record for DOI 10.1214/ss/1009213726 — title, author, Statistical Science volume 16 issue 3, year (page range not present in the record and therefore omitted)"
    contribution: >-
      Distinguished a data-modelling culture, which assumes a stochastic model
      generated the data and interprets its parameters, from an
      algorithmic-modelling culture, which treats the mechanism as unknown and
      judges a method by predictive accuracy alone.
    why_it_mattered: >-
      It named the philosophical split underlying most disagreements about
      machine learning, and predicted the direction the field would take two
      decades before the argument was settled by results.
    descendants: ["the predictive-accuracy evaluation norm",
                  "the interpretability debate"]

  friedman2001:
