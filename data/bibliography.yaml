    url: "https://arxiv.org/abs/1901.04085"
    verified: true
    verified_on: "2026-08-27"
    verified_via: "arXiv abstract page arxiv.org/abs/1901.04085 — title, two authors, v1 dated 13 January 2019 confirmed; the page lists no venue."
    contribution: >
      Fed query and passage jointly to BERT and used the classification head as
      a relevance score, jumping the MS MARCO leaderboard by a wide margin.
    why_it_mattered: >
      It is the origin of the retrieve-then-rerank architecture: the cross
      encoder is far too slow to score a corpus, so a cheap retriever must go in
      front of it. That constraint, not the model, defines the pattern.
    what_changed_after: >
      Two-stage retrieval became the standard architecture for any system that
      cares about precision.
    descendants: ["monoT5", "cross-encoder rerankers", "retrieve-then-rerank"]

  nogueira2020monot5:
    title: "Document Ranking with a Pretrained Sequence-to-Sequence Model"
    authors: ["Rodrigo Nogueira", "Zhiying Jiang", "Ronak Pradeep", "Jimmy Lin"]
    year: 2020
    venue: "Findings of EMNLP 2020, pages 708-718"
    arxiv: "2003.06713"
