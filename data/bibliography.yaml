    verified: true
    verified_on: "2026-08-29"
    verified_via: "arXiv abstract page arxiv.org/abs/2307.13702 - title, thirty authors, July 2023; abstract confirms the intervention methodology of adding mistakes to and paraphrasing the chain of thought, the finding of large across-task variation in how strongly models condition on their own CoT, that the performance boost comes neither from added test-time compute alone nor from the CoT's particular phrasing, and that larger and more capable models produce LESS faithful reasoning on most tasks studied."
    contribution: >
      The measurement method for faithfulness - intervene on the trace and see
