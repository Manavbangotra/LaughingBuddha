    verified_via: "arXiv abstract page arxiv.org/abs/2202.12837 — title, seven authors, v1 dated 25 February 2022, EMNLP 2022 long paper confirmed; abstract confirms that randomly replacing labels in demonstrations barely hurts performance."
    contribution: >
      Found that replacing the labels in few-shot demonstrations with random
      ones barely degrades classification performance, and that what
      demonstrations actually supply is the label space, the input
      distribution, and the sequence format.
    why_it_mattered: >
      It undercuts the natural reading of in-context learning as learning from
