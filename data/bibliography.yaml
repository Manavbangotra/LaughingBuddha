    verified_via: "arXiv abstract page arxiv.org/abs/1808.06226 — two authors, v1 dated 19 August 2018, page states 'Accepted as a demo paper at EMNLP2018'."
    contribution: >
      Removed the pre-tokenization step entirely by treating the input as a raw
      Unicode stream with whitespace encoded as an ordinary symbol, making
      segmentation lossless and reversible and the whole pipeline
      language-independent.
    why_it_mattered: >
      Every earlier subword implementation assumed a whitespace tokenizer ran
      first, which quietly made them wrong for Japanese, Chinese and Thai and
      made detokenization ambiguous everywhere else.
    what_changed_after: >
      SentencePiece became the standard implementation, and the
      "whitespace is just a character" convention is now near-universal.
    descendants: ["Llama tokenizers", "T5 tokenizer", "multilingual tokenizers"]

  kudo2018subword:
    title: "Subword Regularization: Improving Neural Network Translation Models with Multiple Subword Candidates"
    authors: ["Taku Kudo"]
