    verified_via: "Crossref API record for DOI 10.1214/aos/1013203451 — title, author, Annals of Statistics volume 29 issue 5, year (page range not present in the record and therefore omitted)"
    contribution: >-
      Framed boosting as gradient descent in function space: each new weak
      learner is fitted to the negative gradient of the loss with respect to the
      current predictions, which generalises boosting to any differentiable
      loss.
    why_it_mattered: >-
      It turned a collection of algorithms into one principle, and that
      principle is what every modern boosting library implements.
    what_changed_after: >-
      Gradient boosting became the dominant method for tabular prediction, a
      position it has held for two decades.
    descendants: ["XGBoost", "LightGBM", "CatBoost", "gradient-boosted ranking"]

