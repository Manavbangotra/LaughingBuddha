# =============================================================================
#  book.yaml — single source of truth for structure, ordering, and depth tier.
#
#  The build system reads this file to determine reading order, chapter
#  numbering, output grouping, and which chapter template each chapter must
#  satisfy. Chapter bodies live in src/<part-dir>/<slug>.md and carry their own
#  frontmatter (requires / provides / citations / status); tools/checks/
#  reconciles the two and fails the build on any mismatch.
#
#  tier: focused -> 12-section chapter template (see templates/chapter-focused.md)
#  tier: full    -> 21-section chapter template (see templates/chapter-full.md)
# =============================================================================

title: "Machines That Learn and Act"
subtitle: "A Complete Textbook of Modern AI — from Mathematical Foundations to Production Agentic Systems"
edition: "First Edition"
version: "0.1.0-dev"
language: en
build_date_source: git   # page footers use the build date, not a hardcoded one

audience: >-
  Readers with basic programming experience and no formal machine-learning
  background who intend to reach professional AI/ML engineering competence and,
  ultimately, the ability to read and produce research. The book assumes
  willingness to learn Python and to work through mathematics, and it assumes
  nothing else.

# ---------------------------------------------------------------------------
# Depth tiers
# ---------------------------------------------------------------------------
tiers:
  focused:
    sections: 12
    min_words: 2600
    template: templates/chapter-focused.md
  full:
    sections: 21
    min_words: 4200
    template: templates/chapter-full.md

# ---------------------------------------------------------------------------
# Parts and chapters, in reading order. Global chapter numbers are assigned by
# the build from this ordering — never hardcode a chapter number in prose, use
# the {{ch:<id>}} cross-reference macro.
# ---------------------------------------------------------------------------
parts:

  - number: 1
    roman: I
    dir: part-01-mathematics
    title: "Mathematical Foundations"
    tier: focused
    summary: >-
      Only the mathematics that is actually load-bearing for AI, taught for use
      rather than for its own sake. Every concept is tied to the place it later
      appears in the book.
    chapters:
      - {id: math-notation,        slug: ch001-notation,        title: "Mathematical Notation and the Language of Machine Learning"}
      - {id: math-functions,       slug: ch002-functions,       title: "Functions, Exponents, and Logarithms"}
      - {id: math-vectors,         slug: ch003-vectors,         title: "Vectors, Dot Products, and Geometric Intuition"}
      - {id: math-matrices,        slug: ch004-matrices,        title: "Matrices, Matrix Multiplication, and Linear Maps"}
      - {id: math-norms,           slug: ch005-norms,           title: "Norms, Distances, and Similarity Measures"}
      - {id: math-eigen,           slug: ch006-eigen,           title: "Eigenvalues, Eigenvectors, and the Singular Value Decomposition"}
      - {id: math-probability,     slug: ch007-probability,     title: "Probability, Conditional Probability, and Bayes' Theorem"}
      - {id: math-random-vars,     slug: ch008-random-variables,title: "Random Variables, Distributions, and Expectation"}
      - {id: math-covariance,      slug: ch009-covariance,      title: "Variance, Covariance, and Correlation"}
      - {id: math-inference,       slug: ch010-inference,       title: "Statistical Inference, Sampling, and Hypothesis Testing"}
      - {id: math-derivatives,     slug: ch011-derivatives,     title: "Derivatives, Partial Derivatives, Gradients, and the Chain Rule"}
      - {id: math-optimization,    slug: ch012-optimization,    title: "Convexity, Gradient Descent, and Numerical Optimization"}

  - number: 2
    roman: II
    dir: part-02-python
    title: "Python for Data and AI"
    tier: focused
    summary: >-
      The Python that AI work actually uses: vectorized numerics, dataframes,
