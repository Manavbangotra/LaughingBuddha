# ---------------------------------------------------------------------------
# Callout kinds recognised by the renderer (blockquote first-line prefix).
# ---------------------------------------------------------------------------
callouts: [NOTE, WARNING, IMPORTANT, "PRODUCTION TIP", "RESEARCH NOTE", "MATH NOTE", "HISTORY"]

# ---------------------------------------------------------------------------
# Maturity labels required on any technology-specific discussion.
# ---------------------------------------------------------------------------
maturity_labels: [ESTABLISHED, MATURE, EMERGING, EXPERIMENTAL, "RESEARCH FRONTIER"]

# ---------------------------------------------------------------------------
# Code tiers for the verification harness.
#   A = executed locally in .venv and must exit 0
#   B = syntax + import checked only (needs GPU, network, API keys, or a large
#       model). Rendered in the book with a "not executed locally" badge.
#   C = illustrative fragment, not standalone runnable (marked as such in text)
# ---------------------------------------------------------------------------
code_tiers:
  A: {executed: true,  badge: null}
  B: {executed: false, badge: "Requires GPU / API access — verified by static analysis, not executed locally"}
  C: {executed: false, badge: "Illustrative fragment — not a standalone program"}
