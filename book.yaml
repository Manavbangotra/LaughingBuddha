    chapters:
      - {id: py-fundamentals,      slug: ch013-fundamentals,    title: "Python Fundamentals for AI Work"}
      - {id: py-functions-classes, slug: ch014-functions-classes,title: "Functions, Classes, and Modules"}
      - {id: py-environments,      slug: ch015-environments,    title: "Environments, Packaging, and Project Structure"}
      - {id: py-numpy,             slug: ch016-numpy,           title: "NumPy: Arrays, Broadcasting, and Vectorized Computation"}
      - {id: py-pandas,            slug: ch017-pandas,          title: "Pandas: DataFrames, Joins, and Data Wrangling"}
      - {id: py-visualization,     slug: ch018-visualization,   title: "Visualization with Matplotlib"}
      - {id: py-io-apis-sql,       slug: ch019-io-apis-sql,     title: "Files, JSON, APIs, and SQL from Python"}
      - {id: py-engineering,       slug: ch020-engineering,     title: "Debugging, Logging, Testing, Async, and Performance"}

